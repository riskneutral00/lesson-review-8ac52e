<script>
const D={"sections": [{"t": 0, "title": "Audio check and recording consent", "summary": "Mark and Matt sort out a muted-mic problem, and Matt explains he is recording audio and will share it before using it."}, {"t": 34, "title": "Mark's apartment board role", "summary": "Mark explains his new seat on the apartment board, the 400,000 monthly cost he thinks is too high, and his plan to raise awareness gently."}, {"t": 493, "title": "Neighbor perks and communication platform", "summary": "Mark describes asking local restaurants for resident discounts and building a channel, maybe on LINE business mode, for neighbors to reach the board."}, {"t": 796, "title": "Reading The Piper in the Woods", "summary": "Mark talks about how it felt to read a dense English short story and how he read and listened at the same time."}, {"t": 1043, "title": "Story ending and Harris", "summary": "Mark explains his view that Harris is about to cure the disease but fails just before solving it."}, {"t": 1173, "title": "Harris's early investigation scenes", "summary": "Mark describes Harris questioning the first infected man and sees the garrison as a machine where every person is a part."}, {"t": 1445, "title": "Life as part of the machine", "summary": "Mark and Matt discuss work-life balance, 996 culture, and whether society should be optimized for productivity."}, {"t": 1628, "title": "Mark's workaholic years", "summary": "Mark describes how he lived in college, his strict personal rules, and why he pushed himself so hard."}, {"t": 2099, "title": "Video call with a friend", "summary": "Mark explains he will video call a woman from Taichung who is about to marry, and why they were never really together."}, {"t": 2200, "title": "Age gap and being arrogant", "summary": "Mark describes their age gap, her business, and how he was rude or arrogant at 27."}, {"t": 2543, "title": "Every decision is the right one", "summary": "Mark and Matt discuss whether every life decision is right and how switching from physics to medicine shaped him."}, {"t": 3076, "title": "Three stages of life", "summary": "Mark says he entered his third life stage when he moved back to Taoyuan about a year and a half ago."}, {"t": 3125, "title": "Changing your life's frequency", "summary": "Mark uses a physics wave analogy to explain how people can change their frequency and start a new wave, and Matt links it to choice and depression."}, {"t": 3324, "title": "The machine and caring for parents", "summary": "Mark discusses whether you can escape the Asian family 'machine', mentions Taiwan's elder villages, and explains how he plans to support his mom while living in Germany."}, {"t": 3986, "title": "Dr. Harris becoming a plant", "summary": "Mark raises the ending of the book, where the resilient Dr. Harris suddenly turns into a plant, and Matt offers his own interpretation."}, {"t": 4198, "title": "Humans versus AI experience", "summary": "Mark argues that his 13 years of real-life experience and resilience make him different from AI."}, {"t": 4258, "title": "Retiring parents and working purpose", "summary": "Matt explains the phrase 'retire my mom' and why people keep working even after they have enough money."}, {"t": 4613, "title": "Is poverty a disease?", "summary": "Mark and Matt debate whether poverty or doing nothing counts as a sickness, and whether society enslaves people."}, {"t": 4760, "title": "Being your own slave", "summary": "Mark explains his career choice to sacrifice most of his life to work for himself, and Matt connects it to knowing your risk profile."}, {"t": 5212, "title": "Neighbor with a material shop", "summary": "Mark describes a neighbor in his 40s who owns a material shop, and they joke with Matt about the age gap."}, {"t": 5300, "title": "Neighbor's ambition and changing", "summary": "Mark recalls his neighbor's story, how he became more 'wholesome' with age and family, and compares his own carefree life."}, {"t": 5675, "title": "Doctor who became a plant", "summary": "Matt and Mark discuss why the doctor in the book turned into a plant, with a short typhoon and balcony tangent."}, {"t": 6003, "title": "Trauma, plants, and work", "summary": "Mark explains his theory about hidden trauma and hypnotic environments, then Matt shares his view that people are born as plants."}, {"t": 6244, "title": "Work, problem solving, and purpose", "summary": "Mark explains that he now understands his friend's view that work can feel like a violation of human purpose, and that problem solving is the higher-level skill."}, {"t": 6493, "title": "Taiwanese doctors quitting early", "summary": "Mark describes friends who are doctors and why many want to quit, saying they were naive about the life before medical school."}, {"t": 6798, "title": "Gap years and no downtime", "summary": "Mark agrees that Taiwan has no downtime to observe and worries that AI will take away jobs and the option to retire."}, {"t": 6882, "title": "Passion, motivation, and doing well", "summary": "Mark talks about graduating for its own sake, then shares how he now understands the advice to find your passion."}, {"t": 7286, "title": "Friend who burned his books", "summary": "Mark tells the story of a friend who chose medicine over a semiconductor master's and now struggles in residency."}, {"t": 7564, "title": "Typhoon and reading reflection", "summary": "After a quick chat about the typhoon, Mark says the novel was painful but helpful and plans to replay the audiobook at bedtime."}, {"t": 7764, "title": "Next steps: medical exam material", "summary": "Mark explains his tight schedule, and he and Matt agree to turn past medical entrance exam material into English conversations."}, {"t": 8149, "title": "PBL, idioms, and wrap-up", "summary": "Mark explains PBL, they talk about the 'two birds, one stone' idiom, and the lesson ends."}], "moments": [{"t": 67, "said": "But also, I believe there are some members who are innocent, because I actually spent some time talking to one of the members from the board, and because one of my neighbors knows that member well, so she knows that member is probably innocent, and I talked to her.", "better": "I also think some of the members mean well. I talked with one of them, and a neighbor of mine knows her well and says she's probably acting in good faith.", "why": "Split the long sentence, and 'mean well' sounds more natural than 'innocent'.", "kind": "structure"}, {"t": 113, "said": "So the problem now is I and the other neighbor of mine who also got into the board have to push some propaganda agenda to actually lead the board to spend the money wisely.", "better": "So now another neighbor who also joined the board and I have to push an agenda to get the board to spend the money wisely.", "why": "Put 'I' last, and 'propaganda' sounds negative, so 'push an agenda' fits better.", "kind": "word choice"}, {"t": 139, "said": "We actually spent, like, 40,000 amounts every month on security, on people who cleaned up our apartments.", "better": "We spend about 400,000 a month on security and cleaning staff for our building.", "why": "Use present tense for a habit, and say 'a month' instead of 'amounts'.", "kind": "grammar"}, {"t": 194, "said": "So my solution to it, to this, is to actually build a bridge between only ordinary neighbors and the board, and know— let them know what's going on.", "better": "So my solution is to build a bridge between regular neighbors and the board, so they know what's going on.", "why": "Pick one phrase, not 'to it, to this'. Say 'regular', not 'only ordinary'.", "kind": "fluency"}, {"t": 209, "said": "And not trying to accuse someone of doing something, but actually we provide a good service in the first place, and try to aware— try to raise the awareness of everyone in this apartment.", "better": "I'm not trying to accuse anyone. I just want to give good service and raise awareness among everyone in the building.", "why": "Short sentences are clearer. 'Aware' is an adjective, so use 'raise awareness'.", "kind": "structure"}, {"t": 255, "said": "but in Taiwan, if you have too much cushions, you are the problem maker. You are the trouble maker.", "better": "but in Taiwan, if you make too much noise, you become the troublemaker.", "why": "'Cushions' was probably a slip. 'Make noise' fits, and 'troublemaker' is one word.", "kind": "word choice"}, {"t": 398, "said": "I would rather they are misled, because I think going into the board to provide service to everyone, we are not paid, right?", "better": "I'd rather believe they're just misled, because we joined the board to serve everyone, and we're not paid.", "why": "After 'would rather', use 'believe' plus a clause. Give the reason in a simpler order.", "kind": "grammar"}, {"t": 457, "said": "I have been asking around apartment— around— around our apartments, actually my mom's apartments. It's actually— it's normally below 20.", "better": "I've been asking around at other buildings, like my mom's. The market rate is normally below 200k.", "why": "Say the point once and keep numbers consistent. 'Building' is the usual word for one apartment complex.", "kind": "fluency"}, {"t": 562, "said": "So people know me. Also, I got a 12 vote, the highest vote around among the board, right?", "better": "People already know me. I got 12 votes, the most of anyone on the board.", "why": "Votes is plural, and 'the most of anyone' is a natural way to say highest.", "kind": "grammar"}, {"t": 571, "said": "And I try to promote my— the— the message I'm going to run for the board so hard, so I got so much votes, right?", "better": "I promoted my campaign really hard, so I got a lot of votes.", "why": "'Votes' can be counted, so use 'a lot of' or 'so many votes'.", "kind": "grammar"}, {"t": 594, "said": "So I— so I don't want to try too hard, but I want to do my work low key, secretly, so people will notice.", "better": "So I don't want to try too hard. I want to work quietly, so people notice on their own.", "why": "'Secretly' and 'so people will notice' clash. 'Quietly' keeps your meaning clear.", "kind": "word choice"}, {"t": 861, "said": "My durability reading English, right? And also, because it doesn't only provide information, it actually tries to dig into my— how I form my styles, right?", "better": "It tested my stamina for reading English. It also made me think about how I form my own opinions.", "why": "'Stamina' fits better than 'durability' for endurance, and 'think about' is simpler.", "kind": "word choice"}, {"t": 1100, "said": "So he had— he had a technology. He— he has to put in the hour to solve the problem. And so he's got— he's about to solve a problem.", "better": "So he has the technology, and he just has to put in the time to solve the problem. He's about to solve it.", "why": "Keep one tense in a story, and 'put in the time' is the natural phrase.", "kind": "grammar"}, {"t": 1110, "said": "But right before he is able to solve the problem, he— he— he also failed for the disease as well.", "better": "But right before he can solve the problem, he also dies of the disease.", "why": "'Also' and 'as well' say the same thing, so use just one.", "kind": "word choice"}, {"t": 1208, "said": "I actually don't recall where he lies at, but I suppose you are talking about the scenes where he follows the girl to.", "better": "I don't really remember where he lies down. Do you mean the scene where he follows the girl?", "why": "Drop 'at' after 'where', and don't leave a sentence hanging with 'to'.", "kind": "structure"}, {"t": 1260, "said": "Because the disease is causing problems to the garrison.", "better": "Because the disease is causing problems for the garrison.", "why": "We cause problems 'for' someone or something, not 'to' them.", "kind": "word choice"}, {"t": 1288, "said": "Everyone plays a part in the machine. So if the part is taken away, it's stolen, the machine's gone, the machine's broken.", "better": "Everyone plays a part in the machine. If one part is taken away, the machine breaks.", "why": "Say it once, clearly, instead of repeating with several fixes.", "kind": "fluency"}, {"t": 1297, "said": "The other part of the machine are not going to function well because some parts are lost, right?", "better": "The other parts of the machine won't work well because some parts are missing.", "why": "Match plural 'parts' with 'are', and 'missing' sounds more natural than 'lost'.", "kind": "grammar"}, {"t": 1364, "said": "You can breathe, and you can think, and— and you still know your name, you still know your job, but you— but you perceive yourself as a trance.", "better": "You can breathe, you can think, you still know your name and your job, but you feel like you're in a trance.", "why": "Skip the repeated 'and' and 'you still' to make the list flow.", "kind": "fluency"}, {"t": 1390, "said": "So I think I— I would resonate that because by trying to throw in a laws question, it actually gives us a very brief impression what kind of person Dr. Harris is", "better": "I really relate to that, because by asking a question like that, we get a quick sense of what kind of person Dr. Harris is.", "why": "'Resonate' needs 'with', and 'impression of' or 'sense of' needs 'of'.", "kind": "grammar"}, {"t": 1483, "said": "I already become part of the machine. And I believe the machine, like, existence of machine, or the concept, is quite important", "better": "I'm already part of the machine. And I think the idea of the machine is quite important.", "why": "Use the present tense for a current fact, and choose one phrase.", "kind": "grammar"}, {"t": 1483, "said": "because if— if the function of a machine is— if the machine— the machine is more functions, I believe the things that we enjoy right now is because someone worked for this, right?", "better": "because the things we enjoy today exist only because someone worked for them.", "why": "Long tangled sentences get clearer when you stop and restart with one idea.", "kind": "structure"}, {"t": 1746, "said": "I believe once I leave— at— at that time, I believe once I leave, once I still have breath— breath in my— in my nostril, right, I have to take— to make the most use of my life, of my time.", "better": "At that time I believed that as long as I was still breathing, I had to make the most of my life and my time.", "why": "'As long as I'm breathing' and 'make the most of' are natural phrases.", "kind": "word choice"}, {"t": 1871, "said": "I told one of my friends, a very weird principal of mine, even though I like the girl, I would only spend, like, 5 minutes talking to the girl a day.", "better": "I told a friend about a weird principle of mine: even though I liked her, I only spent about five minutes a day talking to her.", "why": "'Principle' is a rule you live by; 'principal' is a school head.", "kind": "word choice"}, {"t": 2108, "said": "And she is going to marry to a guy I don't know, like, in— in a week or two.", "better": "And she's going to marry a guy I don't know, in a week or two.", "why": "\"Marry\" doesn't need \"to\". Say \"marry someone\" or \"get married to someone\".", "kind": "grammar"}, {"t": 2146, "said": "Before she's going— before this one she's going to have, right?", "better": "I mean before this marriage she's about to have.", "why": "Start over cleanly instead of restarting mid-sentence; it's clearer.", "kind": "structure"}, {"t": 2200, "said": "And because she's a bit older than I, right, I was, let's say, 27 or 28 at that time, and she was already 32 or 33.", "better": "She was a bit older than me. I was about 27 or 28 then, and she was already 32 or 33.", "why": "Use \"than me\" in speech, and split long sentences into two.", "kind": "structure"}, {"t": 2261, "said": "I think being— during the process of going— opening a new business, like it's already existing, or like it's not yet existing, those brilliant minds are actually captivating.", "better": "I think people who are opening a new business, whether it already exists or is just an idea, are captivating.", "why": "Pick one clear subject first, then say what you think about it.", "kind": "structure"}, {"t": 2318, "said": "I was happy, but I was actually also— some part of me was actually kind of regretless.", "better": "I was happy for her, but part of me felt a little regret too.", "why": "\"Regretless\" means no regret. Use \"felt some regret\" for what you mean.", "kind": "word choice"}, {"t": 2337, "said": "I felt I was a little bit buggler.", "better": "I felt I was a little bit arrogant.", "why": "Great that you found \"arrogant\". \"Bugger\" is rude slang, so avoid it.", "kind": "word choice"}, {"t": 2514, "said": "But I would say I was striving for— for girls, and sometimes it knows other people's feelings.", "better": "I was chasing girls, and sometimes I didn't pay attention to other people's feelings.", "why": "Keep the same subject \"I\" so the meaning stays clear.", "kind": "structure"}, {"t": 2529, "said": "I lack of empathy sometimes.", "better": "I lacked empathy sometimes.", "why": "\"Lack\" is a verb here, so no \"of\". Use past tense for back then.", "kind": "grammar"}, {"t": 2543, "said": "She got upset about it. ... she sometimes got mad for me about it.", "better": "She sometimes got mad at me about it.", "why": "We get mad \"at\" a person, not \"for\" them.", "kind": "word choice"}, {"t": 2791, "said": "I would be so much better because I study— because I study as a physician so much earlier than I'm about to be, so that will grant me a much more advantage than I am right now, right?", "better": "I'd be much better off, because I'd have started studying medicine so much earlier, which would give me a big advantage over where I am now.", "why": "Use \"would have + past participle\" for imagined past situations, and \"a big advantage\".", "kind": "grammar"}, {"t": 2844, "said": "I believe that is the traits a lot of medical students do not have, do not even get a chance to experience.", "better": "I believe those are traits a lot of medical students don't have, and don't even get a chance to develop.", "why": "Match plural \"traits\" with \"those are\", and keep your verbs parallel.", "kind": "grammar"}, {"t": 2899, "said": "So I wouldn't say I regret about my decision. I would say I wish I had more time and more wisdom to— to explore more things in shorter times.", "better": "So I wouldn't say I regret my decision. I just wish I'd had more time and wisdom to explore more things in less time.", "why": "\"Regret\" takes no \"about\". Use \"in less time\" instead of \"shorter times\".", "kind": "grammar"}, {"t": 3133, "said": "I— I wouldn't say— I wouldn't say the third chapter will last long. But before that, I— I— I would actually echo how your friend— how we change our frequency.", "better": "I don't think the third chapter will last long. But before that, I want to come back to what your friend said about how we can change our frequency.", "why": "Cut the repeats and use 'come back to' instead of 'echo'.", "kind": "fluency"}, {"t": 3185, "said": "I— I'm sure it's not how we say it in English, but we have a different wave, a new wave.", "better": "I'm not sure that's how you'd say it in English, but we start a new wave.", "why": "'Start a new wave' is clear, and 'I'm not sure' sounds more natural.", "kind": "word choice"}, {"t": 3337, "said": "I believe in Asia, the burden on you from being absent in your job is more severe, right? And— and also, I'm right now absent from my job.", "better": "I think in Asia, the pressure of taking time off work is much heavier. And right now, I'm actually on leave from my job.", "why": "'Absent' means missing a day. Use 'take time off' or 'on leave'.", "kind": "word choice"}, {"t": 3470, "said": "And it's still market to explore.", "better": "And it's still a market worth exploring.", "why": "Use 'a market' and 'worth exploring'. Don't use 'market' as an adjective.", "kind": "structure"}, {"t": 3536, "said": "And the business is started by Wang Yongqin, who is more rich than a billionaire.", "better": "The business was started by Wang Yongqin, who was richer than a billionaire.", "why": "Short adjectives use '-er', and use past tense for a past story.", "kind": "grammar"}, {"t": 3585, "said": "And he also studied, built the village for elderly people, and— but the market is still— still has so much room for you to explore.", "better": "He also built a village for elderly people, but there's still a lot of room in the market for you to explore.", "why": "Pick one verb, and don't start a new idea mid-sentence.", "kind": "structure"}, {"t": 3649, "said": "And— but that doesn't mean I have to sacrifice my life for taking care of my mom, because— because— because it— it can also—", "better": "But that doesn't mean I have to sacrifice my life to take care of my mom.", "why": "Use 'to + verb' for purpose. Finish the thought before adding a reason.", "kind": "grammar"}, {"t": 3689, "said": "Younger generation have to take care of the older generation, or they are going to die uncareful, right?", "better": "The younger generation has to take care of the older one, or the older people won't get the care they need.", "why": "Add 'the', match 'generation' with 'has', and avoid 'uncareful'.", "kind": "grammar"}, {"t": 3743, "said": "And she do not have the knowledge, and she— she actually— she— she is actually kind of opposed to that.", "better": "And she doesn't have the knowledge, and she's actually kind of against the idea.", "why": "Use 'she doesn't' for one person, and drop the repeated 'she'.", "kind": "grammar"}, {"t": 3765, "said": "I genuinely want to take care of yourself myself, but also have to— to— to— I have my own life to live, right?", "better": "I genuinely want to take care of you myself, but I also have my own life to live.", "why": "Use 'take care of you' when talking to her, and finish one idea.", "kind": "structure"}, {"t": 3822, "said": "if you want to see your son frankly, you will have to come with me.", "better": "if you want to see me often, you'll have to come with me.", "why": "'Frankly' is for honest opinions. Use 'often' or 'regularly' for how often.", "kind": "word choice"}, {"t": 4121, "said": "So it actually surprised me that he become the plant at— at the end.", "better": "So it actually surprised me that he became a plant at the end.", "why": "Use past tense 'became', and 'a plant' because it's a new idea.", "kind": "grammar"}, {"t": 4207, "said": "I am not AI. And I— I don't know if AI have emotions, but I am sure they lack of real-life experience.", "better": "I'm not AI. I don't know if AI has emotions, but I'm sure it lacks real-life experience.", "why": "AI is singular, so 'has'. 'Lack' is a verb, so no 'of' needed.", "kind": "grammar"}, {"t": 4222, "said": "And it actually requires you be very resilient, and you have to suffer so much pain. So your character is hard to break, actually.", "better": "It takes a lot of resilience, and you go through a lot of pain. So your character becomes hard to break.", "why": "Use 'requires you to be' or 'takes resilience'. 'Suffer so much pain' is a bit heavy.", "kind": "structure"}, {"t": 4298, "said": "A Japanese word affects me, because in Japanese, sometimes retire means gone.", "better": "It's the Japanese influence. In Japanese, 'retire' can sometimes mean 'gone'.", "why": "'A Japanese word affects me' is unclear. Name the influence, then explain it.", "kind": "word choice"}, {"t": 4308, "said": "So you know why— why I react in that way? Because— yeah, you know why I react in that way. Yeah.", "better": "So you know why I reacted that way, right?", "why": "Say it once, cleanly. Use past tense for a reaction that already happened.", "kind": "fluency"}, {"t": 4366, "said": "No, no, no. I am not going to tamping. But I guess what you are trying to say, are they free?", "better": "No, no, no. That's not me. But I guess what you're asking is, are they free?", "why": "Embedded questions use statement order: 'what you're asking is whether they're free'.", "kind": "structure"}, {"t": 4493, "said": "But if you actually read the story, you can know seconds before he actually found a potential solution to all of that problem, and he was so eager to solve the problem.", "better": "But if you actually read the story, you'll see that seconds before he turned, he had found a possible solution to all those problems, and he was so eager to solve them.", "why": "Use 'all those problems' (plural). 'Can know' becomes 'can see' or 'you'll see'.", "kind": "grammar"}, {"t": 4598, "said": "I— I mean, a society is like a system, yeah, because you— if you work, you get rewarded something. The society rewards you results of money, right?", "better": "I mean, society is like a system. If you work, you get rewarded, and society pays you in money.", "why": "'Reward' needs 'with' or 'for': 'rewards you with money'. Drop the article before 'society'.", "kind": "grammar"}, {"t": 4640, "said": "You get high pressure if you— you— you eat unhealthy.", "better": "You get high blood pressure if you eat unhealthily.", "why": "The medical term is 'high blood pressure'. Use the adverb 'unhealthily' after 'eat'.", "kind": "word choice"}, {"t": 4760, "said": "I think you bring it out a little— you brought it out a little bit about in modern society, we still enslave people, but in a different way, right?", "better": "I think you brought up a good point: in modern society, we still enslave people, just in a different way, right?", "why": "'Bring up' is the natural phrase for raising a topic. Pick one verb tense.", "kind": "word choice"}, {"t": 4771, "said": "So I think it's— it was when— it was when I was 22 or 23, I thought about it because I— I think a lot of time, I still got a whole lot ahead of me, right?", "better": "I thought about it when I was 22 or 23, because I felt I still had a whole lot ahead of me.", "why": "Start with one clear event, then give the reason. Keep the tense in the past.", "kind": "structure"}, {"t": 4836, "said": "I would say I would act— actually sacrifice 99% of my life. It's very dangerous.", "better": "I would actually be willing to sacrifice 99% of my life. I know that's extreme.", "why": "'Willing to' shows choice. 'Extreme' fits better than 'dangerous' for a life choice.", "kind": "word choice"}, {"t": 4898, "said": "So— so I— I cannot, like, complain during the process for the pain, because that's what I choose.", "better": "So I can't complain about the pain along the way, because it's what I chose.", "why": "Complain 'about' something. Use past tense 'chose' for a decision already made.", "kind": "grammar"}, {"t": 5231, "said": "True. True. But only 10 years apart, so that's not— that's not— that's not huge.", "better": "True, but we're only 10 years apart, so it's not that big a gap.", "why": "Say 'not that big' once instead of repeating 'that's not'. Cleaner and smoother.", "kind": "fluency"}, {"t": 5237, "said": "That's not a huge difference about, right?", "better": "That's not a huge difference, right?", "why": "'About' isn't needed here. Just end the sentence after 'difference'.", "kind": "grammar"}, {"t": 5261, "said": "But we still can talk.", "better": "But we can still talk.", "why": "'Still' goes after 'can' and before the main verb.", "kind": "structure"}, {"t": 5480, "said": "And he has— he had a— he have— he has a material shop, so he also knows a little, one thing or two about the market rates on material, right?", "better": "And he has a material shop, so he also knows a thing or two about market rates for materials.", "why": "The idiom is 'a thing or two'. Also, 'rates for' is more natural.", "kind": "word choice"}, {"t": 5551, "said": "And right now, he feel he already knows his limits.", "better": "And right now, he feels like he already knows his limits.", "why": "Add -s to 'feels' for he/she/it. 'Feels like' sounds natural here.", "kind": "grammar"}, {"t": 5573, "said": "But when I heard this, I feel he become more wholesome, but also.", "better": "But when I heard this, I felt he'd become more wholesome.", "why": "Keep the tense consistent. 'Heard' goes with 'felt', and 'he'd become' sets the earlier time.", "kind": "grammar"}, {"t": 5627, "said": "He probably got a lot of injury, mental injury along the way, because he had to build out his own material shop, right?", "better": "He probably took a lot of mental damage along the way, because he had to build his own shop from scratch.", "why": "'Injury' is physical. Try 'mental damage' or 'emotional scars'. 'Build' works without 'out'.", "kind": "word choice"}, {"t": 5656, "said": "Not— not 100% carefree, but for some— for some point, on some level, I'm carefree compared to him.", "better": "Not 100% carefree, but on some level I am, compared to him.", "why": "'On some level' already says it. Drop 'for some point'.", "kind": "structure"}, {"t": 5755, "said": "I'm trying to figure out why he become a plant at a critical point.", "better": "I'm trying to figure out why he became a plant at such a critical point.", "why": "After 'why he', use past tense 'became' since the story is already over.", "kind": "grammar"}, {"t": 5877, "said": "The environment simply have carry possess the ability to hypnotize people.", "better": "The environment simply has the ability to hypnotize people.", "why": "Pick one verb and match it to the subject: 'The environment has'.", "kind": "grammar"}, {"t": 6184, "said": "There is another character from this— from this story actually say— I— I think it's actually Weissberger.", "better": "Another character in the story actually says it. I think it's Weissberger.", "why": "Say 'says' for the present tense. Splitting the idea into two sentences makes it clearer.", "kind": "structure"}, {"t": 6231, "said": "It's a— it's very requiring, even though the most easy— the easiest job, the easiest form of work is very high level of ability, actually.", "better": "It's very demanding. Even the easiest job takes a high level of skill.", "why": "Use 'demanding' instead of 'requiring'. Splitting this long sentence also avoids the tangle.", "kind": "word choice"}, {"t": 6244, "said": "I wouldn't say at that time I agree or I disagree with him, but I certainly now understand why he had that feeling or he had that observation as well.", "better": "At the time, I wouldn't say I agreed or disagreed with him, but I definitely understand now why he felt that way.", "why": "Use past tense after 'at that time', and 'agree or disagree' as verbs.", "kind": "grammar"}, {"t": 6263, "said": "Because it's not about you are lazy or you are diligent, you are hard working or not.", "better": "It's not about whether you're lazy or diligent, or whether you work hard or not.", "why": "After 'about', use 'whether' to introduce the either/or idea.", "kind": "structure"}, {"t": 6273, "said": "It's about how to solving— problem solving is a higher level.", "better": "It's about problem solving, which is a higher level of skill.", "why": "Pick one clean noun phrase instead of restarting mid-sentence.", "kind": "fluency"}, {"t": 6291, "said": "I would say work itself can be viewed— can be seen as a violation against the purpose of human being.", "better": "I'd say work itself can be seen as a violation of the purpose of human beings.", "why": "'Violation of', and plural 'human beings' or 'being human'.", "kind": "word choice"}, {"t": 6493, "said": "I have lots of friends who is already working as a doctor right now.", "better": "I have lots of friends who are already working as doctors.", "why": "'Friends' is plural, so use 'who are' and 'doctors'.", "kind": "grammar"}, {"t": 6511, "said": "And he say a— a lot of them say their classmates is going to quit as a job, as a doctor before 30, or 35, or 40", "better": "A lot of them say their classmates are going to quit being doctors before 30, 35, or 40.", "why": "Say 'quit being a doctor', and match 'classmates are'.", "kind": "grammar"}, {"t": 6547, "said": "I see my senior mentor dies.", "better": "I saw my senior mentor die.", "why": "Use 'saw' for past events, then the base verb 'die'.", "kind": "grammar"}, {"t": 6608, "said": "I think they actually lack of real-life experience before they go to medical school.", "better": "I think they actually lack real-life experience before they go to medical school.", "why": "'Lack' already means 'don't have', so drop 'of'.", "kind": "word choice"}, {"t": 6637, "said": "You barely have life.", "better": "You barely have a life.", "why": "Don't forget 'a'. Also, 'barely' already means almost none, so skip 'no'.", "kind": "grammar"}, {"t": 6675, "said": "So who can they blame for?", "better": "So who can they blame?", "why": "'Blame' takes the person directly, with no 'for' at the end.", "kind": "grammar"}, {"t": 6817, "said": "Nowadays, AI are going to take million people's job, right?", "better": "Nowadays, AI is going to take millions of people's jobs, right?", "why": "AI is singular, and say 'millions of' with plural 'jobs'.", "kind": "grammar"}, {"t": 7176, "said": "I become more— I think during these past few months, I understand myself better because I— I think if I keep doing something I don't enjoy, I— I— I would simply pass the minimum", "better": "Over the past few months, I've come to understand myself better. If I keep doing something I don't enjoy, I'll just do the bare minimum.", "why": "Split the long tangled sentence into two, and use present perfect.", "kind": "structure"}, {"t": 7286, "said": "One is going for master's and go for semiconductors to work as an engineer.", "better": "One is going for a master's in semiconductors and working as an engineer.", "why": "Keep verb forms parallel, and use 'in' to name the field.", "kind": "structure"}, {"t": 7297, "said": "And the second one is he wants to become a doctor, like I did right now, like what I do right now.", "better": "The second is that he wants to become a doctor, like what I'm doing right now.", "why": "Use present continuous for now, and fix your sentence once instead of restarting.", "kind": "grammar"}, {"t": 7334, "said": "He just felt he don't want to waste a single— a single second of his life on those stuff.", "better": "He just felt he didn't want to waste a single second of his life on that stuff.", "why": "Match the past tense, and use 'that stuff', not 'those stuff'.", "kind": "grammar"}, {"t": 7355, "said": "And I think this is so true because— because you— you can tell by— by the act he's burning all those material.", "better": "I think that's so true, because you can tell by the way he burned all that material.", "why": "'Material' has no plural, so use 'all that material'. Use past tense for a finished story.", "kind": "grammar"}, {"t": 7421, "said": "But after he graduated, I don't think he's going to work because he don't enjoy it.", "better": "But after he graduated, I don't think he would have kept working, because he wouldn't enjoy it.", "why": "With 'he', use 'doesn't'. Hypothetical stories fit 'would'.", "kind": "grammar"}, {"t": 7444, "said": "So I mean, what we were talking about here, I mean, so many people spend their whole life— they didn't actually make a decision.", "better": "What we were talking about is that so many people spend their whole lives never actually making a decision.", "why": "Cut 'I mean' and join two ideas with 'never + -ing'.", "kind": "fluency"}, {"t": 7477, "said": "Sometimes because how— how— how inexperienced they are, sometimes the hospital don't care.", "better": "Sometimes, because the residents are so inexperienced, the hospital doesn't take enough care.", "why": "Use 'because' plus a clear subject, and 'hospital' takes 'doesn't'.", "kind": "structure"}, {"t": 7501, "said": "And because they lack of experience, and their seniors do not have all day to look after them, so they sometimes make mistakes and the patients are dead because of them.", "better": "Because they lack experience, and their seniors can't watch them all day, they sometimes make mistakes and patients die.", "why": "'Lack' needs no 'of'. Drop 'so' when you start with 'because'. Use 'die'.", "kind": "grammar"}, {"t": 7666, "said": "I know the plot, so I'm going to play the audiobook when— where I— where I— and in my bed.", "better": "I know the plot, so I'm going to play the audiobook in bed.", "why": "Say the place once and skip the restarts. Short sentences feel natural.", "kind": "fluency"}, {"t": 7716, "said": "So I think the metaphor is the same because I already read the novel with the audiobook.", "better": "So I think the idea is the same, because I already read the novel along with the audiobook.", "why": "'Metaphor' is a bit off here. 'Idea' or 'comparison' fits your meaning.", "kind": "word choice"}, {"t": 8149, "said": "It's problem solve lecture.", "better": "It's a problem-solving lecture.", "why": "Use the '-ing' adjective form, and add the article 'a'.", "kind": "grammar"}, {"t": 8271, "said": "But sometimes I— I try to translate all those terminology, but maybe I will lose one or two.", "better": "Sometimes I try to translate all the terminology, but I might miss a term or two.", "why": "'Terminology' is uncountable, so use 'all the terminology'. 'Might' fits a possibility.", "kind": "word choice"}], "transcript": [{"t": 0, "who": "Matt", "text": "Okay, can you hear me—"}, {"t": 1, "who": "Mark", "text": "Hi."}, {"t": 2, "who": "Matt", "text": "Yeah."}, {"t": 2, "who": "Mark", "text": "Yeah, it's perfect. I thought— I thought you could hear me, but— And I also pushed the unmute button, but it didn't work at all, so I don't know what happened, yeah."}, {"t": 13, "who": "Matt", "text": "Okay, no problem. I'll look into that and see if I can fix that. So, before we start, I am recording this."}, {"t": 20, "who": "Matt", "text": "I'm recording audio only right now, and then I'm going to see what I can do with that. And before I, like, do anything else with it, I'll show you, and that way you can approve or disapprove of what I'm doing, okay?"}, {"t": 31, "who": "Mark", "text": "Yeah. Okay, perfect."}, {"t": 34, "who": "Matt", "text": "Cool. So, before we get into the piper in the woods, I know that you've been pretty busy recently with being newly elected— Congratulations!"}, {"t": 47, "who": "Mark", "text": "No, you shouldn't congratulate me, because it's so much work. And also, I expect to face some pressure from the previous members on the board, so—"}, {"t": 61, "who": "Matt", "text": "Yeah. Is it because they just don't want new members? Is that why?"}, {"t": 67, "who": "Mark", "text": "Uh, I would say partially, yes. But also, I believe there are some members who are innocent, because I actually spent some time talking to one of the members from the board, and because one of my neighbors knows that member well, so she knows that member is probably innocent, and I talked to her. And I believe the board is spending too much unnecessary money on useless projects, because they are misled."}, {"t": 106, "who": "Mark", "text": "Yeah. So, I would say most members probably are innocent."}, {"t": 113, "who": "Mark", "text": "So the problem now is I and the other neighbor of mine who also got into the board have to push some propaganda agenda to actually lead the board to spend the money wisely. For example, we actually spent— sorry, it's too hot."}, {"t": 139, "who": "Mark", "text": "We actually spent, like, 40,000 amounts every month on security, on people who cleaned up our apartments. 40 million of— of— of 41."}, {"t": 161, "who": "Matt", "text": "41?"}, {"t": 162, "who": "Mark", "text": "每个月。"}, {"t": 164, "who": "Matt", "text": "Okay, so that's—"}, {"t": 164, "who": "Mark", "text": "That's too much."}, {"t": 165, "who": "Matt", "text": "That's 400,000."}, {"t": 167, "who": "Mark", "text": "Yeah, 400,000, yeah."}, {"t": 169, "who": "Matt", "text": "Okay, okay."}, {"t": 170, "who": "Mark", "text": "And that's crazy."}, {"t": 171, "who": "Matt", "text": "Because I was going to say 41 is no problem. 41, it's not even one person's sin sure, you know? But okay."}, {"t": 176, "who": "Mark", "text": "要清洁工、保全、物业经理，40万一个月。"}, {"t": 182, "who": "Matt", "text": "Okay."}, {"t": 183, "who": "Mark", "text": "That's too much money. So I— and also, because I think we are new members, right? So I don't think we can just go in and say, \"Stop doing this.\""}, {"t": 194, "who": "Mark", "text": "It's not going to work. So my solution to it, to this, is to actually build a bridge between only ordinary neighbors and the board, and know— let them know what's going on."}, {"t": 209, "who": "Mark", "text": "And not trying to accuse someone of doing something, but actually we provide a good service in the first place, and try to aware— try to raise the awareness of everyone in this apartment. Yeah."}, {"t": 225, "who": "Mark", "text": "I know it sounds— it sounds— why would I even do this? Because it actually doesn't grant me any money, right?"}, {"t": 238, "who": "Mark", "text": "But 400,000 is crazy every month. So I— I would say it's probably— have to go back to my personality, because I don't think they are actually trying to spend the money wisely."}, {"t": 255, "who": "Mark", "text": "So I— I will say what I can do, and— but I also don't want to cause too— too much problem, too much trouble, because in this— in the— I don't know what it's like in America, but in Taiwan, if you have too much cushions, you are the problem maker. You are the trouble maker."}, {"t": 278, "who": "Mark", "text": "Yeah."}, {"t": 278, "who": "Matt", "text": "Yeah, this is a— this is especially an Asian perspective, especially in Japan, and then, you know, Taiwan has a lot of cultural—"}, {"t": 288, "who": "Mark", "text": "Yeah, we are more similar to Japan than America, right?"}, {"t": 292, "who": "Matt", "text": "Yeah. So, like, the thought process in Japan and Taiwan is, \"I should not impede anyone else.\" I should not get in someone else's way."}, {"t": 301, "who": "Matt", "text": "I should not trouble them, even if it costs me an extra— you know, like, how many— you guys have, like— let's say it costs each house an extra 2,000 a month. It's like, \"Oh, it's not worth it.\""}, {"t": 314, "who": "Matt", "text": "It's like, everyone's— they call it polite, but it's really—"}, {"t": 319, "who": "Mark", "text": "Bureaucratic."}, {"t": 320, "who": "Matt", "text": "It's— it's like being a coward, I want to say."}, {"t": 325, "who": "Mark", "text": "Sometimes we are. Sometimes we are."}, {"t": 327, "who": "Matt", "text": "Yeah."}, {"t": 327, "who": "Mark", "text": "Yeah."}, {"t": 328, "who": "Matt", "text": "Because you hear— yeah, there's— there's a lot of things. But what I would say is, have you seen the movie Inception?"}, {"t": 335, "who": "Mark", "text": "Uh, I have heard of it, but never had a chance to watch it. Yeah."}, {"t": 339, "who": "Matt", "text": "Okay. So the basis of Inception is, how do you make someone— how do you influence someone's decision-making, and you let them think that it's their own choice that brought them there? And so instead of saying, \"We need to make these changes,\" what you can do is, you can bring all the evidence up, and then bring all, like, suggestions up."}, {"t": 366, "who": "Mark", "text": "Yeah."}, {"t": 367, "who": "Matt", "text": "Or, like, alternatives."}, {"t": 368, "who": "Mark", "text": "Yeah."}, {"t": 368, "who": "Matt", "text": "And then remove yourself from the situation. Let everyone else figure out what they want to do."}, {"t": 375, "who": "Mark", "text": "Yeah."}, {"t": 376, "who": "Matt", "text": "This is one— this is one way. But yeah, I— I know, of course, if they're spending money incorrectly, of course there's a combination of options. It's either someone is maliciously doing this, so they're doing it on purpose."}, {"t": 392, "who": "Matt", "text": "Maybe, you know, they know the person that owns the roofing company."}, {"t": 398, "who": "Mark", "text": "I— I would rather they are misled, because I think going into the board to provide service to everyone, we are not paid, right? So, I mean, if I just jump in and accuse anyone of doing unclean money, I— I would— I would say it's actually trying to stop people from actually sacrificing their time to do the public service."}, {"t": 426, "who": "Mark", "text": "I— I would say that would do the opposite. Yeah."}, {"t": 429, "who": "Matt", "text": "Of course they're, like, misled, but there's somebody that's leading. And so the question is, are they doing it on purpose or not?"}, {"t": 438, "who": "Mark", "text": "No."}, {"t": 439, "who": "Matt", "text": "Yeah, we just—"}, {"t": 440, "who": "Mark", "text": "We will— we will try to figure it out."}, {"t": 441, "who": "Matt", "text": "Yeah, yeah, yeah. It could just be they can't spend enough time to look for better quotes, so they just go with the first option. That— that— that is a possibility."}, {"t": 450, "who": "Matt", "text": "But, you know, when you're 3 times more than the market rate, it's not hard to—"}, {"t": 457, "who": "Mark", "text": "Yeah. I— I have been asking around apartment— around— around our apartments, actually my mom's apartments. It's actually— it's normally below 20."}, {"t": 470, "who": "Mark", "text": "It's 200k. It's normally the market rate is below 200k."}, {"t": 477, "who": "Mark", "text": "Yeah."}, {"t": 477, "who": "Matt", "text": "But are you comparing the number of units you have compared to the number of—"}, {"t": 481, "who": "Mark", "text": "Yeah."}, {"t": 481, "who": "Matt", "text": "Oh, okay, okay."}, {"t": 482, "who": "Mark", "text": "Yeah. Similar scale. Yeah."}, {"t": 484, "who": "Mark", "text": "Yeah. So."}, {"t": 484, "who": "Matt", "text": "Yeah, I mean, yeah, hopefully— hopefully people are energized to think of a solution."}, {"t": 493, "who": "Mark", "text": "Yeah. So I— actually, I— I don't think I can do it for the first few months, but I will just try to provide good service to my neighbors, because we have so many restaurants around our apartments, right? So I will try to go ask those restaurants, \"Hey, we have, like, 215 units, so that means—\" let's say 700."}, {"t": 521, "who": "Mark", "text": "Separation in our apartments, so it's not very smart, right? So I will ask the restaurant around near my— my mom's apartments, \"Hey, we have so many people, so maybe when we go to your restaurant and we show—\" because we all have an app that shows which apartment we live in."}, {"t": 543, "who": "Mark", "text": "So when we show the app, \"Can you give us special discounts?\" So that—"}, {"t": 551, "who": "Matt", "text": "Yeah."}, {"t": 551, "who": "Mark", "text": "So that actually— so that actually give a message to my neighbors, \"Someone is taking care of the apartment.\""}, {"t": 562, "who": "Mark", "text": "So— so people know me. Also, I got a 12 vote, the highest vote around among the board, right?"}, {"t": 570, "who": "Mark", "text": "So."}, {"t": 570, "who": "Matt", "text": "Yeah."}, {"t": 571, "who": "Mark", "text": "And I try to promote my— the— the message I'm going to run for the board so hard, so I got so much votes, right? So. But I— I don't want to try too hard, because sometimes when you try too hard, people will be— you are a little bit sus, right?"}, {"t": 594, "who": "Mark", "text": "You are a little bit suspicious. So I— so I don't want to try too hard, but I want to do my work low key, secretly, so people will notice."}, {"t": 603, "who": "Mark", "text": "Yeah."}, {"t": 604, "who": "Matt", "text": "Yeah. And then you can also still concentrate on bringing the value in other places, like you said."}, {"t": 609, "who": "Mark", "text": "Yeah, bringing the value first."}, {"t": 610, "who": "Matt", "text": "Restaurants, and doing, like— like the fair type of thing that you said for your community, to have, like, other vendors come into your apartments and set up something. You mentioned that earlier."}, {"t": 623, "who": "Mark", "text": "Yeah. Also, we don't have digital platform for— for neighbors to— to pass their message to the board. So I'm going to build a platform so everybody will have a voice, because sometimes when they try to inform— inform the board of something they care about, the message doesn't go to them."}, {"t": 647, "who": "Matt", "text": "There's actually a very— there's a very popular app in America called— I think it's called Neighborhood or something. Let me see. Neighborhood app."}, {"t": 661, "who": "Matt", "text": "Oh, it's called Next Door. I'll send it to you."}, {"t": 663, "who": "Mark", "text": "Next Door."}, {"t": 664, "who": "Matt", "text": "Yeah. I can— it should be not too difficult to just clone it. Let me see."}, {"t": 673, "who": "Mark", "text": "No, actually, you know LINE has a business mode, right?"}, {"t": 679, "who": "Matt", "text": "Oh, no. So my— my LINE is— because it's from America, I don't have the same features as your LINE."}, {"t": 686, "who": "Mark", "text": "Yeah, because back in college, me and my— my friend and I post so much work— work place."}, {"t": 695, "who": "Matt", "text": "Yeah."}, {"t": 695, "who": "Mark", "text": "Is that how we say it? So we— we— we tend to use the business mode of LINE. It's very useful."}, {"t": 702, "who": "Mark", "text": "So I think that's— that's pretty enough. Yeah."}, {"t": 705, "who": "Matt", "text": "Yeah, yeah, yeah. Oh, yeah, Asia does, like, more super apps. Like, you know, China does, like, WeChat."}, {"t": 712, "who": "Mark", "text": "WeChat."}, {"t": 713, "who": "Matt", "text": "Yeah. So Taiwan probably uses LINE more like a super app. America is very fractured."}, {"t": 719, "who": "Matt", "text": "So I know what you're saying, but I haven't used anything like that myself."}, {"t": 723, "who": "Mark", "text": "I can show you that after I open another business account. Yeah."}, {"t": 729, "who": "Matt", "text": "Okay."}, {"t": 730, "who": "Mark", "text": "That's so cool, because you can send— send message to 100 users at the same time. So that's pretty useful. Yeah."}, {"t": 739, "who": "Matt", "text": "Yeah."}, {"t": 739, "who": "Mark", "text": "If you want to start a business, probably you will have to use that too. Yeah."}, {"t": 743, "who": "Matt", "text": "Yeah, I need to get— I need to separate out my phone so I can keep my— I have, like— I have a lot of phone numbers, because I have, like, 3 in America, 1 in Thailand, 1 in Taiwan, and some other countries. So I've been trying to set up my phone so that I can use different applications that are not region-locked. So I haven't done Taiwan yet."}, {"t": 766, "who": "Matt", "text": "All right. That's cool."}, {"t": 768, "who": "Matt", "text": "That's good to hear that you have these plans for how you want to help your community and stuff."}, {"t": 774, "who": "Mark", "text": "Yeah."}, {"t": 775, "who": "Matt", "text": "I saw you posted on Instagram that you were reading The Piper in the Woods, and so."}, {"t": 780, "who": "Mark", "text": "Yeah, I finished that."}, {"t": 782, "who": "Matt", "text": "You finished it? Okay, okay."}, {"t": 783, "who": "Mark", "text": "Yeah."}, {"t": 784, "who": "Matt", "text": "Cool. So I did some skimming of it. I didn't read it."}, {"t": 791, "who": "Matt", "text": "I did some skimming. But I did— I have— I know enough to talk about it."}, {"t": 795, "who": "Mark", "text": "Okay."}, {"t": 796, "who": "Matt", "text": "Yeah. And so that's today's topic, is just going through here. And the purpose is just to be more analytical in your thought and thinking about how to articulate most naturally in English, right?"}, {"t": 812, "who": "Matt", "text": "So your purpose, number 1, was to read more English."}, {"t": 815, "who": "Mark", "text": "Yeah."}, {"t": 815, "who": "Matt", "text": "So what was your experience like reading more English? Was it uncomfortable, or was it like riding a bicycle?"}, {"t": 821, "who": "Mark", "text": "Yeah, it's very uncomfortable, because— I don't know— because when we— when we are talking about— when it comes to short stories, it's not much of the text. It's not much of the word, right? But the information is trying to convey a very high density."}, {"t": 842, "who": "Matt", "text": "Yeah."}, {"t": 842, "who": "Mark", "text": "So it tries to say so much in so— in— in, let's say, thousands of words or 10,000 words, but it gives so much information. So it actually tries— it actually challenged my— my patience and my—"}, {"t": 861, "who": "Matt", "text": "Yeah."}, {"t": 861, "who": "Mark", "text": "My durability reading English, right? And also, because it doesn't only provide information, it actually tries to dig into my— how I form my styles, right? Because it questions people sometimes."}, {"t": 883, "who": "Mark", "text": "For example, you probably know the story actually is about people are getting some very— some very serious disease. People are turning into plants, right?"}, {"t": 898, "who": "Mark", "text": "And do you know what it— what it ends? How it ends, the story?"}, {"t": 906, "who": "Matt", "text": "It kind of ends as, like, a question. It's open-ended. It's not— I don't remember specifically how it ends."}, {"t": 914, "who": "Matt", "text": "No, but I—"}, {"t": 915, "who": "Mark", "text": "Oh, you can go through Wikipedia so fast, so we can talk."}, {"t": 920, "who": "Matt", "text": "Okay."}, {"t": 922, "who": "Mark", "text": "Actually, I think you can actually feed to AI, so you can have AI to summarize it for you. I— I read it myself with audio, and I— not only with audio, I also read it too. But AI can help you a lot, I'm sure."}, {"t": 939, "who": "Mark", "text": "Yeah."}, {"t": 940, "who": "Matt", "text": "Okay. Give me a second."}, {"t": 956, "who": "Matt", "text": "As you were reading it, how did you break it up?"}, {"t": 962, "who": "Matt", "text": "Was it, like, 30 minutes at a time, or were you able to do, like, whole chapters at a time? Or what was your experience getting back into just reading English?"}, {"t": 973, "who": "Mark", "text": "You mean the emotional time?"}, {"t": 977, "who": "Matt", "text": "No, the— the reading time for— for Piper in the Woods."}, {"t": 980, "who": "Mark", "text": "Oh, reading time, because— I think because I actually read it while I was listening to the audiobook at the same time. So it was on the speed, right? So it's about 14 minutes."}, {"t": 995, "who": "Mark", "text": "Yeah."}, {"t": 997, "who": "Matt", "text": "Oh, okay, okay. Cool."}, {"t": 998, "who": "Mark", "text": "Yeah."}, {"t": 999, "who": "Matt", "text": "So you were listening to it while reading along in your head."}, {"t": 1004, "who": "Mark", "text": "Yeah."}, {"t": 1005, "who": "Matt", "text": "And then were you able to think about what the words meant, or were the words just going through, like, your eyes and just, like, coming out?"}, {"t": 1014, "who": "Mark", "text": "Ah."}, {"t": 1017, "who": "Mark", "text": "Actually, I— I mean, it actually challenged me to— to read, but when I start reading, I don't have to translate, and I— it just— it don't just go through my eyes and just out. No."}, {"t": 1032, "who": "Mark", "text": "It actually stays in my mind, and I can understand, and I can have some time to rethink what it actually tries to."}, {"t": 1043, "who": "Matt", "text": "Comprehend, yeah."}, {"t": 1043, "who": "Mark", "text": "Yeah, comprehend. Yeah."}, {"t": 1045, "who": "Matt", "text": "Okay, yeah, because I know a lot of students, when they're reading, they'll read the whole passage and they have no idea what it means."}, {"t": 1052, "who": "Mark", "text": "No, no, no, that's fair. That's fair."}, {"t": 1055, "who": "Matt", "text": "A, A, A, yeah, okay. So yeah, so the ending of the story is that Paris, like, he says that he's solved the mystery, but he hasn't cured it."}, {"t": 1067, "who": "Mark", "text": "Yeah."}, {"t": 1069, "who": "Matt", "text": "Yeah. So, like, because not everything necessarily needs to be cured, maybe."}, {"t": 1078, "who": "Mark", "text": "No, no. Actually, I think he's about to cure it, yes, because on the asteroid, he— he found what the pipers are about, right? But he cannot solve the problem there."}, {"t": 1093, "who": "Mark", "text": "So he's going to— going back to Y3, where he probably worked, right?"}, {"t": 1098, "who": "Matt", "text": "Yeah."}, {"t": 1100, "who": "Mark", "text": "So he had— he had a technology. He— he has to put in the hour to solve the problem. And so he's got— he's about to solve a problem."}, {"t": 1110, "who": "Mark", "text": "But right before he is able to solve the problem, he— he— he also failed for the disease as well."}, {"t": 1119, "who": "Matt", "text": "Yeah. Okay."}, {"t": 1120, "who": "Mark", "text": "Yeah. So that's pretty sad."}, {"t": 1124, "who": "Matt", "text": "So I'd like to start chronologically through the story."}, {"t": 1128, "who": "Mark", "text": "Okay."}, {"t": 1128, "who": "Matt", "text": "And then get from the beginning until the end. And then while we're breaking it down, we'll do comparisons around our own lives and say, \"This is how you identify with the problem,\" or, \"You overcame this thing yourself,\" or you're like, \"No, this is just, like, a funny story that, like, is just a novella to read. It doesn't really reflect on me at all."}, {"t": 1151, "who": "Matt", "text": "I don't identify with it.\" I think a lot of the not only Taiwanese people that I talk to, but, like, people in my generation, in your generation, feel this way."}, {"t": 1163, "who": "Matt", "text": "And then I want to make a comparison to a very popular thing in China, but we'll get there when we get there, okay?"}, {"t": 1172, "who": "Mark", "text": "Okay."}, {"t": 1173, "who": "Matt", "text": "All right. So I guess, let's see, starting off, yeah, when Harris is leaving Y3, let's see."}, {"t": 1184, "who": "Matt", "text": "I guess when Harris was, like, laying on the ground, on the soil, and he falls asleep, did that, like, resonate with you at all? Was it like, \"I empathize with him."}, {"t": 1199, "who": "Matt", "text": "I understand why he's doing this,\" or is it like, \"Oh, this is just an interesting way to begin\"?"}, {"t": 1208, "who": "Mark", "text": "I actually don't recall where he lies at, but I suppose you are talking about the scenes where he follows the girl to."}, {"t": 1219, "who": "Matt", "text": "Oh, that's much later. That's much later. But that's— we can go— we can go there also, yeah."}, {"t": 1223, "who": "Matt", "text": "We can talk about when he's following the girl into the woods."}, {"t": 1228, "who": "Mark", "text": "Yeah, but— but what are you referring to? Because I don't recall where he lies."}, {"t": 1235, "who": "Matt", "text": "Like, no— no one specific place, but just earlier in the story, you know, he— he gets restful. He's like— he's taking a break from his patrol. He's just like, \"Oh, I'm just going to lay out on—\" so sometimes he's laying out on the stone, and then he's like, \"Oh, just come sit with me on the stone,\" and stuff like that."}, {"t": 1254, "who": "Mark", "text": "Oh, oh, I see. Because that's— that's very early on, right?"}, {"t": 1259, "who": "Matt", "text": "Yeah, yeah, yeah."}, {"t": 1260, "who": "Mark", "text": "Yeah, I know what you're talking— what scene you are talking about right now. I think he's actually trying to do some early research, some early investigation about the disease, right? Because the disease is causing problems to the garrison."}, {"t": 1278, "who": "Mark", "text": "If they don't stop the disease, the garrison will die. Like— like how the story framed the society, it's a machine, right?"}, {"t": 1288, "who": "Mark", "text": "Everyone plays a part in the machine. So if the part is taken away, it's stolen, the machine's gone, the machine's broken."}, {"t": 1297, "who": "Mark", "text": "The other part of the machine are not going to function well because some parts are lost, right? So they are trying to figure out what is happening with the broken parts, right?"}, {"t": 1312, "who": "Mark", "text": "So that's why he sits down with— what's the name? Cobral Wesburg."}, {"t": 1319, "who": "Matt", "text": "Yeah."}, {"t": 1319, "who": "Mark", "text": "The first guy got infected. Okay. So I think he is showing some extraordinary professionalism during that, because he is trying to diagnose the symptom, right?"}, {"t": 1347, "who": "Mark", "text": "He says, \"I become— I got turned into a trance.\" What do you mean?"}, {"t": 1354, "who": "Mark", "text": "Do you know— do you think you are a trance? It's like a question go back and forth, right?"}, {"t": 1360, "who": "Mark", "text": "Do you think you are a trance? What do you mean by that?"}, {"t": 1364, "who": "Mark", "text": "You can breathe, and you can think, and— and you still know your name, you still know your job, but you— but you perceive yourself as a trance. So he's actually like a doctor, or like some people who study laws, try to pluck out something by asking questions, right?"}, {"t": 1390, "who": "Mark", "text": "So I think I— I would resonate that because by trying to throw in a laws question, it actually gives us a very brief impression what kind of person Dr. Harris is, because he shows high level of professionalism, high level of skills, right?"}, {"t": 1416, "who": "Mark", "text": "So that's how I see these things, right?"}, {"t": 1421, "who": "Matt", "text": "And do you think that it's very accurate that everybody is just a piece in the machine in real life? And do you think that when he decides, like, he doesn't need to be part of a machine, the machine can exist or doesn't need to exist without him? Like, how do you— how do you think that is in your own life?"}, {"t": 1445, "who": "Mark", "text": "Okay."}, {"t": 1448, "who": "Mark", "text": "So your first question is, do I think the machine, like, frame the society as a machine is documented?"}, {"t": 1456, "who": "Matt", "text": "Yeah, you would— you would agree with that. So basically, they— they work— I think they work 10 days and get 1 day off or something like that, right?"}, {"t": 1465, "who": "Mark", "text": "Yeah. Yeah."}, {"t": 1466, "who": "Matt", "text": "So they work, yeah, very much like that. And do you think— I guess— I guess, what do you think about that? Is that a way to live, or is that a way to be a machine?"}, {"t": 1476, "who": "Mark", "text": "Yeah, it's very controversial, because in my age, I probably already become the part, right?"}, {"t": 1483, "who": "Matt", "text": "Yeah."}, {"t": 1483, "who": "Mark", "text": "I already become part of the machine. And I believe the machine, like, existence of machine, or the concept, is quite important, because if we— the reason why I say it's controversial, because I am not working for a machine at this moment, but I also believe the machine is important, because if— if the function of a machine is— if the machine— the machine is more functions, I believe the things that we enjoy right now is because someone worked for this, right?"}, {"t": 1532, "who": "Mark", "text": "So if someone stopped working for this, the— like— like the story said, the society cannot keep going."}, {"t": 1547, "who": "Mark", "text": "So what—"}, {"t": 1547, "who": "Matt", "text": "But there's different types of downtime on machines. So in this example, there is, you know, 10% downtime. So in Asian culture, let's say, a very popular thing that to discuss anyways is 996, right?"}, {"t": 1564, "who": "Mark", "text": "Ah."}, {"t": 1564, "who": "Matt", "text": "So you say, \"Oh, it's a privilege that you can work this much,\" right?"}, {"t": 1569, "who": "Mark", "text": "Yeah."}, {"t": 1570, "who": "Matt", "text": "It's your— not only is it your responsibility, but you should be so grateful that you can do that."}, {"t": 1576, "who": "Mark", "text": "Yeah."}, {"t": 1576, "who": "Matt", "text": "But if we look at other societies, if you look at, like— well, France is very famous for this, like France, Spain, the Mediterranean countries. But even in Asia, you can look at, like, Thailand, they have a completely different attitude, and so they have a different type of machine. Like, they still function— they function differently."}, {"t": 1598, "who": "Matt", "text": "And instead of maybe 10% downtime, maybe they have, like, 30 to 50% downtime. And is it very important, or who is it important to, that you optimize a machine to have as little downtime as possible versus you think of the machine differently and you say, \"Okay, I need the machine to sustain my life, but that's it."}, {"t": 1621, "who": "Matt", "text": "I don't need it to be optimized for productivity. I need it to be optimized for something else.\""}, {"t": 1628, "who": "Mark", "text": "Okay. That comes to a personal belief. What do I live for?"}, {"t": 1634, "who": "Mark", "text": "I mean, it's weird, but I believe there is a certain percentage of people in the society who believe if they stop working, they are worthless. They— they can— they can end their life already."}, {"t": 1648, "who": "Mark", "text": "Yeah."}, {"t": 1648, "who": "Matt", "text": "Yeah, yeah, yeah, there's definitely workaholics, yeah."}, {"t": 1651, "who": "Mark", "text": "Yeah. I— I believe there is some part of me is workaholic, actually. Although at this moment I don't work, right, because I—"}, {"t": 1661, "who": "Matt", "text": "Yeah."}, {"t": 1662, "who": "Mark", "text": "I study and I prepare for— for my— for my training, right? And— but— okay, so if I separate my life so far into three parts, I would say the first one is my childhood."}, {"t": 1681, "who": "Mark", "text": "The second one is my— it's a mix of my— my— my me going to college and work, right? And the third— and the third part is right now, full-time study."}, {"t": 1696, "who": "Mark", "text": "So let's skip the first— first part, because the first part is ordinary. It's like everyone else."}, {"t": 1704, "who": "Mark", "text": "Most part was like everyone else. But the second part, I was workaholic, and I tried my best in doing everything— in everything I do, right?"}, {"t": 1718, "who": "Mark", "text": "And also I have to work and— and study at the same time. So, you know, I had very high expectations about my life."}, {"t": 1730, "who": "Mark", "text": "So that's why I put in so much work, so much hours. If I don't have so much expectation about my life, I can just be ordinary, and I don't have to work so hard."}, {"t": 1746, "who": "Mark", "text": "I believe once I leave— at— at that time, I believe once I leave, once I still have breath— breath in my— in my nostril, right, I have to take— to make the most use of my life, of my time. So I would say at that time I wasn't a bad— I wasn't an asshole, but some of my classmates would say, \"Oh, you— you never hang out with us because you were always busy.\""}, {"t": 1780, "who": "Mark", "text": "So that was years later. I— I still have very good relationships with them, but that was years later when I look back, maybe I was too harsh."}, {"t": 1790, "who": "Mark", "text": "I didn't mean to offend everyone, but maybe I can try to take a different approach. I mean, rejecting people is considered an ass, right?"}, {"t": 1805, "who": "Mark", "text": "Also accepting people is al— also considered an ass."}, {"t": 1810, "who": "Matt", "text": "An ass, like?"}, {"t": 1812, "who": "Mark", "text": "Art."}, {"t": 1813, "who": "Matt", "text": "Spell that."}, {"t": 1815, "who": "Mark", "text": "A-R-T."}, {"t": 1817, "who": "Matt", "text": "Art? Oh, okay, okay."}, {"t": 1818, "who": "Mark", "text": "Yeah."}, {"t": 1818, "who": "Matt", "text": "Okay. Yes, definitely. Yeah, being able to say no, especially being able to say no with no further explanation is definitely— I don't know if art is the right word, but yeah, it's definitely a huge value."}, {"t": 1834, "who": "Mark", "text": "Yeah, it's a huge value. Oh, yeah, maybe Chinese are affecting me, but I would say it's art anyway."}, {"t": 1841, "who": "Matt", "text": "Yeah, yeah."}, {"t": 1842, "who": "Mark", "text": "Yeah."}, {"t": 1845, "who": "Mark", "text": "So at that time, I— I think— okay, so at that time, there are only three places that you are expected to find me when I was in Taichung or in Taipei. One is classroom, one is my dorm, one is my lab."}, {"t": 1862, "who": "Matt", "text": "Yeah."}, {"t": 1863, "who": "Mark", "text": "No— no other place. And— and I don't reply to— to line message. Yeah."}, {"t": 1870, "who": "Matt", "text": "Yeah."}, {"t": 1871, "who": "Mark", "text": "And— oh, I— I think I— I told you before, there was a girl in my— when I was in sophomoral, I met a Korean girl, right?"}, {"t": 1882, "who": "Matt", "text": "Yeah, yeah."}, {"t": 1883, "who": "Mark", "text": "Okay. So she actually was confused why I didn't spend so much time replying to her message. And I told one of my friends, a very weird principal of mine, even though I like the girl, I would only spend, like, 5 minutes talking to the girl a day."}, {"t": 1914, "who": "Mark", "text": "Times outside of that 5 minutes time frame, I am not responsible— I am not responsible for that. That was kind of rude, and I didn't say that because I was arrogant."}, {"t": 1927, "who": "Mark", "text": "I was just stating— I was just stating my— my principle at that time. And—"}, {"t": 1937, "who": "Matt", "text": "Do we— do you think this amount of focus that you had towards your schoolwork, was that out of your choice because you wanted— like, you were so passionate about the end product, or was that out of, like, societal fears, like, \"I don't want to let down my parents\" or the expectations? It was something that you— you wanted for yourself?"}, {"t": 1962, "who": "Mark", "text": "I mean, I— okay. I would say it's different now, the second one. It's 100% the first one, because I— I fully understand I only got one life to live, and once the time is consumed, or once the time is spent, I don't get the time back."}, {"t": 1984, "who": "Mark", "text": "So at that time, because I was so young and so energetic, and I believe I should use my energy to build my knowledge or build my career at that time, to prepare to— to actually pave the foundation for what I am about to do. So."}, {"t": 2008, "who": "Matt", "text": "Okay. So I'm going to— I'm going to give you a quote, and then we're going to move into the next chapter of your life, okay?"}, {"t": 2016, "who": "Mark", "text": "Okay."}, {"t": 2017, "who": "Matt", "text": "So the quote is, \"We have two lives, and the second begins when we realize we only have one.\""}, {"t": 2028, "who": "Mark", "text": "Oh. Yeah. But maybe I actually get an idea— let's say when I was 18."}, {"t": 2038, "who": "Mark", "text": "So I probably do not have that much of first life. I— I begin— I began the second life very early on."}, {"t": 2047, "who": "Matt", "text": "I was about to say, I'm— I'm probably on my fifth life right now."}, {"t": 2051, "who": "Mark", "text": "Oh."}, {"t": 2053, "who": "Matt", "text": "You know a little bit about—"}, {"t": 2054, "who": "Mark", "text": "You are going to be a cat. You are going to have nine lives."}, {"t": 2058, "who": "Matt", "text": "Yeah, yeah. I'm trying to go back to my previous lives. But yeah, I think, you know, like, YOLO is, like, really popular, and then—"}, {"t": 2068, "who": "Mark", "text": "Yeah."}, {"t": 2068, "who": "Matt", "text": "It's— it's juvenile in thought, but that doesn't make it inaccurate."}, {"t": 2074, "who": "Mark", "text": "Yeah. Yeah, but— but I became more human when I look back, knowing that I could have been more considerate, or knowing I could be— I— I— I was never a bad guy, but I— okay, so I— I— I try to make things short, because we still have things to talk about."}, {"t": 2097, "who": "Matt", "text": "Of course. Yeah."}, {"t": 2099, "who": "Mark", "text": "Yeah, yeah, yeah. I know, I know, I know. I'm going to have a video call with a girl I met in Taichung, right?"}, {"t": 2108, "who": "Mark", "text": "And she is going to marry to a guy I don't know, like, in— in a week or two. And—"}, {"t": 2117, "who": "Matt", "text": "That's the other person you told me about before?"}, {"t": 2119, "who": "Mark", "text": "No, no, no."}, {"t": 2120, "who": "Matt", "text": "Oh, someone else? Okay, okay."}, {"t": 2122, "who": "Mark", "text": "No."}, {"t": 2128, "who": "Mark", "text": "I— I wouldn't dare to say that we actually have some feelings for each other. I wouldn't say that, because I was not in the— in the right condition, and she was not either, because she got— she— she— she had a previous marriage."}, {"t": 2145, "who": "Mark", "text": "Yeah."}, {"t": 2146, "who": "Matt", "text": "Yeah."}, {"t": 2146, "who": "Mark", "text": "Before she's going— before this one she's going to have, right? And I was still deeply in— in a strong connection to— to another girl at that time. So both of us were not in the right condition."}, {"t": 2165, "who": "Mark", "text": "And—"}, {"t": 2165, "who": "Matt", "text": "So the other girl that you were talking to, you gave her 10 minutes a day instead of 5 minutes a day?"}, {"t": 2170, "who": "Mark", "text": "No, no, no, no. I was not a fuckboy. I— I— when I— when I talked to a girl, I was dead serious."}, {"t": 2180, "who": "Mark", "text": "Yeah."}, {"t": 2180, "who": "Matt", "text": "Okay, okay."}, {"t": 2181, "who": "Mark", "text": "Yeah."}, {"t": 2184, "who": "Mark", "text": "So both of— both of us were not in the right condition, right— in the right mode. But we appreciate— we appreciate each other's perspective on this world."}, {"t": 2200, "who": "Mark", "text": "And because she's a bit older than I, right, I was, let's say, 27 or 28 at that time, and she was already 32 or 33. So that's, let's say, 6 or 7 years apart, right?"}, {"t": 2215, "who": "Mark", "text": "And— so she was a bit more mature than I was, right?"}, {"t": 2225, "who": "Mark", "text": "Obviously. But— so— but we— we talked, and we had FaceTime every morning."}, {"t": 2235, "who": "Mark", "text": "Yeah. And I also adored her because she was also an entrepreneur."}, {"t": 2244, "who": "Mark", "text": "Yeah, she opened a jewelry shop in Taichung, and she— and I learned that she's going to have another business launching recently. So I love to— I love talking to entrepreneurs."}, {"t": 2260, "who": "Mark", "text": "Yeah."}, {"t": 2261, "who": "Matt", "text": "Yeah."}, {"t": 2261, "who": "Mark", "text": "And because I— I think being— during the process of going— opening a new business, like it's already existing, or like it's not yet existing, those brilliant minds are actually captivating. Sorry, pronunciation is—"}, {"t": 2285, "who": "Matt", "text": "Captivating, right?"}, {"t": 2287, "who": "Mark", "text": "It's broken. Yeah, yeah."}, {"t": 2288, "who": "Matt", "text": "Captivating, yeah."}, {"t": 2288, "who": "Mark", "text": "Yeah, they are captivating. And I also learned a lot talking to them, and— and try to steal some— some knowledge, right? And also, I— I think a reason why they also want to spend time with me is because I also offer them some of my experience, and we exchange ideas, we exchange opinions, right?"}, {"t": 2318, "who": "Mark", "text": "So I enjoy talking to people like her. And she told me that she is going to marry to someone else."}, {"t": 2325, "who": "Mark", "text": "I was happy, but I was actually also— some part of me was actually kind of regretless."}, {"t": 2335, "who": "Matt", "text": "Yeah."}, {"t": 2335, "who": "Mark", "text": "Like— let's say 1%."}, {"t": 2337, "who": "Matt", "text": "Yeah."}, {"t": 2337, "who": "Mark", "text": "Because she was smart and she was brilliant. But back at the time when I was in Taichung and I talked to her frequently, I felt I was a little bit buggler."}, {"t": 2353, "who": "Mark", "text": "Is that the word?"}, {"t": 2355, "who": "Matt", "text": "Yeah, bothered, annoyed, same thing. Yep."}, {"t": 2358, "who": "Mark", "text": "No, no, buggler."}, {"t": 2360, "who": "Matt", "text": "Oh. Huh? You felt a little buggler?"}, {"t": 2364, "who": "Mark", "text": "Oh, buggler."}, {"t": 2364, "who": "Matt", "text": "Can you spell that?"}, {"t": 2366, "who": "Mark", "text": "No, I— I don't remember how to spell it."}, {"t": 2368, "who": "Matt", "text": "No, don't worry."}, {"t": 2369, "who": "Mark", "text": "I only—"}, {"t": 2369, "who": "Matt", "text": "Don't worry, I'm—"}, {"t": 2371, "who": "Mark", "text": "有点自负."}, {"t": 2373, "who": "Matt", "text": "Oh, I don't know."}, {"t": 2374, "who": "Mark", "text": "Go out."}, {"t": 2377, "who": "Mark", "text": "I— I— I speak— I speak broken English, and your Chinese is not good. So that's good."}, {"t": 2382, "who": "Mark", "text": "That's funny."}, {"t": 2383, "who": "Matt", "text": "Yeah, yeah, yeah. Let me look this up really fast."}, {"t": 2387, "who": "Mark", "text": "I— I will try to Google it, because I don't remember how to spell this word. Yeah. Bugg— ah, bugger."}, {"t": 2396, "who": "Matt", "text": "Arrogant."}, {"t": 2398, "who": "Mark", "text": "No, ah, arrogant can be the word, but I—"}, {"t": 2400, "who": "Matt", "text": "Yeah."}, {"t": 2400, "who": "Mark", "text": "I'm saying bugger. Is it— is it—"}, {"t": 2405, "who": "Matt", "text": "That's what I thought— that's what I thought you were saying, but it didn't make sense to me. But yeah, okay."}, {"t": 2410, "who": "Mark", "text": "Oh, so what does this word mean?"}, {"t": 2412, "who": "Matt", "text": "Vulgar?"}, {"t": 2413, "who": "Mark", "text": "Yeah."}, {"t": 2420, "who": "Matt", "text": "I need to look it up. I— I use the word without truly understanding the word. Yeah, it's just— it's just general rudeness."}, {"t": 2428, "who": "Mark", "text": "Yeah, I was rude."}, {"t": 2429, "who": "Matt", "text": "Yeah."}, {"t": 2430, "who": "Mark", "text": "Yeah, I was rude, because— I mean, she— she knows I— I was not a bad guy, and
