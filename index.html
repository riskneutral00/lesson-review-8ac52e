rk", "text": "Huh?"}, {"t": 5983, "who": "Matt", "text": "I also do that on my balcony."}, {"t": 5985, "who": "Mark", "text": "What a fuck."}, {"t": 5987, "who": "Matt", "text": "I'm— I'm on the— I'm on the highest floor. I'm on the earthly level, and there's nobody above me."}, {"t": 5992, "who": "Mark", "text": "Oh. That's okay. Nobody sees you."}, {"t": 5994, "who": "Matt", "text": "Yeah."}, {"t": 5996, "who": "Mark", "text": "I mean, that's funny when nobody see you. Yeah. That's okay."}, {"t": 6000, "who": "Mark", "text": "Yeah. That's— that's so good."}, {"t": 6003, "who": "Mark", "text": "Yeah. I— I mean, the environment has the ability to hypnotize people, right?"}, {"t": 6010, "who": "Mark", "text": "And also I believe— because we only see a very small part of Dr."}, {"t": 6025, "who": "Mark", "text": "Harry's, so this is my guess, right? Like I mentioned, I know we one must been— must— must go through a lot, carry a lot of pain, probably some traumas along the way to become a professional, right?"}, {"t": 6044, "who": "Mark", "text": "Dr. Harry's might probably have to go through those inevitable pains as well."}, {"t": 6052, "who": "Mark", "text": "And all those being affected, all those being turned into plants are also highly trained experts, actually. Actually, I think the most trained experts are the first group of people being affected, right?"}, {"t": 6072, "who": "Mark", "text": "So probably during his journey, during his research, going into those environments that has ability to hypnotize people, some part of his trauma go to the surface, haunt him, and he will— he— and those traumas got him. And he didn't even realize it, because you know emotion sometimes is underneath."}, {"t": 6102, "who": "Mark", "text": "It's not like on the surface. You— sometimes it affects you even though you don't— even though you don't notice it, right?"}, {"t": 6113, "who": "Matt", "text": "Yeah. Yeah. Yeah."}, {"t": 6114, "who": "Matt", "text": "It stays under your skin."}, {"t": 6115, "who": "Mark", "text": "Yeah."}, {"t": 6118, "who": "Matt", "text": "So I looked up the perspective that I had on this question, and that is that the doctor realized that the cure was actually to become the plant."}, {"t": 6135, "who": "Matt", "text": "Like, you were never— like, so my perspective is different than yours."}, {"t": 6139, "who": "Mark", "text": "Yeah. I'm listening. Yeah."}, {"t": 6141, "who": "Matt", "text": "Yeah. So my perspective is everyone is born as a plant, and it is society or whatever that turns you into a machine. And so when he's part of the machine and he has the cure to— or he's close to having the cure of fixing the plant, he realized it is like— you know, it is a mystery but not a cure."}, {"t": 6166, "who": "Matt", "text": "Why did I ever become a machine? I was originally a plant, and then I just want to return to being a plant."}, {"t": 6177, "who": "Mark", "text": "I agree. Because the story actually implied that point too."}, {"t": 6182, "who": "Matt", "text": "Yeah."}, {"t": 6184, "who": "Mark", "text": "Yeah. True. There is another character from this— from this story actually say— I— I think it's actually Weissberger."}, {"t": 6195, "who": "Mark", "text": "It's not the other guy. He actually say, I— you also read that, right?"}, {"t": 6203, "who": "Mark", "text": "That sentence, \"I wish I become a plant sooner.\" And he later on, he elaborates, \"Maybe we are just born to be plants.\""}, {"t": 6216, "who": "Mark", "text": "Yeah. It could be."}, {"t": 6217, "who": "Mark", "text": "It could be. And also a friend of mine from college, well, because we have been talking a lot these days, and he said working is a very high level of skills."}, {"t": 6231, "who": "Mark", "text": "Yeah. It's a— it's very requiring, even though the most easy— the easiest job, the easiest form of work is very high level of ability, actually."}, {"t": 6244, "who": "Mark", "text": "Yeah. So at that time, I— I— I wouldn't say at that time I agree or I disagree with him, but I certainly now understand why he had that feeling or he had that observation as well."}, {"t": 6263, "who": "Mark", "text": "Because it's not about you are lazy or you are diligent, you are hard working or not."}, {"t": 6273, "who": "Mark", "text": "It's about how to solving— problem solving is a higher level."}, {"t": 6283, "who": "Mark", "text": "So I wouldn't say every single— every kind of— every category of work needs problem solving. I don't think so."}, {"t": 6291, "who": "Mark", "text": "But I would say work itself can be viewed— can be seen as a violation against the purpose of human being. Could be."}, {"t": 6306, "who": "Mark", "text": "It could be. Yeah."}, {"t": 6310, "who": "Mark", "text": "Yeah. It's possible."}, {"t": 6311, "who": "Mark", "text": "Yeah. I— I would say it's possible."}, {"t": 6313, "who": "Matt", "text": "Yeah. I think one of the things that makes me different than everybody else, and it annoys a lot of people— I have mostly girls— a lot of girls say, \"Why am I so immature?\""}, {"t": 6329, "who": "Matt", "text": "Okay? That's— that's one example."}, {"t": 6332, "who": "Mark", "text": "Okay."}, {"t": 6332, "who": "Matt", "text": "A lot of guys ask me, \"Why do I do the things that I do?\" Or, \"Why do I think the way that I do?\" So as part of the machine, you're supposed to go to college, get a job, work until you're 60-some, and then retire, right?"}, {"t": 6350, "who": "Mark", "text": "Yeah. Yeah."}, {"t": 6350, "who": "Matt", "text": "And so I actually say, like, it's not that I am immature. You define— the— the way that you define immature, I think, is only with a certain perspective."}, {"t": 6367, "who": "Mark", "text": "Yeah."}, {"t": 6368, "who": "Matt", "text": "I would say that I am childish, okay? I behave like a child. I think like a child."}, {"t": 6375, "who": "Matt", "text": "I act like a child. And so you call this immature, just like a plant is a sickness."}, {"t": 6381, "who": "Matt", "text": "And it's really— weren't we all like a child? Didn't you used to be like a child?"}, {"t": 6388, "who": "Mark", "text": "Yeah."}, {"t": 6389, "who": "Matt", "text": "Huh?"}, {"t": 6390, "who": "Mark", "text": "Yeah."}, {"t": 6390, "who": "Matt", "text": "Yeah. You used to be a child. And then, for whatever reason, you became part of the machine."}, {"t": 6396, "who": "Matt", "text": "Maybe your parents put you into the machine. You had to go to, like, Bushi Ban or whatever, and then you had to go do all these things to go to school and blah, blah, blah."}, {"t": 6406, "who": "Matt", "text": "And then it's like."}, {"t": 6407, "who": "Mark", "text": "Yeah."}, {"t": 6407, "who": "Matt", "text": "Why are you questioning me? Why are you blaming me for being childish, whereas you are, in my perspective, actually the disease? Why did you change so much?"}, {"t": 6421, "who": "Matt", "text": "Like, if you look at cancer cells, like, what is a cancer cell? A cancer cell is just rapid mutation."}, {"t": 6428, "who": "Mark", "text": "Yeah. Yeah. True."}, {"t": 6431, "who": "Mark", "text": "True."}, {"t": 6431, "who": "Matt", "text": "So am— am I the cancer cell, or is— is everybody else the cancer cell?"}, {"t": 6437, "who": "Mark", "text": "Ah."}, {"t": 6439, "who": "Matt", "text": "I'm the same person I've always been. It's just— oh, I've been the same person for 40 years. So I'm— I— I was the same person for longer."}, {"t": 6445, "who": "Matt", "text": "I didn't— I didn't mutate. You're going to— you're going to blame me for that."}, {"t": 6450, "who": "Mark", "text": "I see. I see your point. That's a— a very— yeah."}, {"t": 6454, "who": "Mark", "text": "That's a really hard take, but— but I agree. Yeah."}, {"t": 6459, "who": "Mark", "text": "I agree. Yeah."}, {"t": 6460, "who": "Matt", "text": "But that— that comes back to the theme about Piper in the Woods, okay?"}, {"t": 6465, "who": "Mark", "text": "Yeah."}, {"t": 6465, "who": "Matt", "text": "You were born a child. You decided to become a machine. Your goal."}, {"t": 6471, "who": "Mark", "text": "Yeah."}, {"t": 6472, "who": "Matt", "text": "Is sometimes to become a child again."}, {"t": 6477, "who": "Mark", "text": "Yeah. True. Although we— we are going to kill ourselves."}, {"t": 6480, "who": "Mark", "text": "We have to become a child again. Yeah."}, {"t": 6483, "who": "Matt", "text": "Yeah. And so the doctor is like, \"Well, I can just become a doc— I can just become a child now.\" Okay."}, {"t": 6490, "who": "Matt", "text": "Like, I don't— I don't need to cure the other children."}, {"t": 6493, "who": "Mark", "text": "I mean, that— that is what happening to Taiwan right now, because obviously I have lots of friends who is already working as a doctor right now. I— I have, like, six or seven. We— we— we are still in touch right now."}, {"t": 6510, "who": "Matt", "text": "Yeah."}, {"t": 6511, "who": "Mark", "text": "And he say a— a lot of them say their classmates is going to quit as a job, as a doctor before 30, or 35, or 40, because they say, \"The system doesn't pay me the way I deserve,\" or, or, \"Even though they pay me the way I deserve, it's so much work."}, {"t": 6542, "who": "Mark", "text": "I cannot take it anymore. I cannot put in the hour anymore."}, {"t": 6547, "who": "Mark", "text": "I see my senior mentor dies.\""}, {"t": 6552, "who": "Matt", "text": "What I will become. It's not my destiny."}, {"t": 6554, "who": "Mark", "text": "Yeah. And also they die days after they retire."}, {"t": 6559, "who": "Matt", "text": "Yeah."}, {"t": 6559, "who": "Mark", "text": "They die so quickly. So what's my purpose? I— I— I'd rather spend my time go out and travel."}, {"t": 6567, "who": "Mark", "text": "I— I'd rather spend my time talking to someone I like. I— I— simply be in the sun, like a plant too."}, {"t": 6577, "who": "Mark", "text": "They actually say they want to enjoy the sunlight. They don't want to work as a doctor anymore."}, {"t": 6582, "who": "Mark", "text": "But they spend six or seven years in medical school, and before last, we have to go to— go spend, like, at least 12 years of school to go into medical school. But they're rather— they're rather quick to give up because they say it's not worth it anymore."}, {"t": 6605, "who": "Mark", "text": "I— I become a plant. I agree."}, {"t": 6608, "who": "Mark", "text": "And also because I think they actually lack of real-life experience before they go to medical school. They didn't actually re— they didn't really actually think through why they want to become a doctor."}, {"t": 6623, "who": "Mark", "text": "So that's why they— I agree the pain and the— the struggle is real, because being a doctor means that you barely have no life. Yeah."}, {"t": 6635, "who": "Mark", "text": "You— you barely have life. Yeah."}, {"t": 6637, "who": "Mark", "text": "And they didn't— they probably heard of it, but unless your parents or your relatives are doctors, you— you— unless your relatives are doctors, you are never going to understand what life means, because you barely have life."}, {"t": 6658, "who": "Mark", "text": "So they regret it. They— so they were so naive before they go to medical school."}, {"t": 6663, "who": "Mark", "text": "But right now, when they graduate from medical school, they barely have no life. They complain about it."}, {"t": 6670, "who": "Mark", "text": "They say, \"I want to become a plant.\" They do not have that commitment before they go to medical school."}, {"t": 6675, "who": "Mark", "text": "So who— so who can they blame for? I understand the struggle, but let's say."}, {"t": 6681, "who": "Matt", "text": "You have— you have to blame— you have to blame the machine. You are part of the machine, whether you realize it or not. And so the machine says, when you are at a certain age, you start studying until you test in, and then after you test in, you continue studying until you do the next step."}, {"t": 6696, "who": "Matt", "text": "There's a lot of people that I talk to, they're about to graduate with whatever degree, and I ask, \"Oh, like, let's say they're 大三,\" and I'm ask— I ask them, \"Oh, what do you want to do?\" They're like, \"I don't know.\""}, {"t": 6707, "who": "Matt", "text": "They have no idea what their job."}, {"t": 6709, "who": "Mark", "text": "Screw you. You are screwed."}, {"t": 6711, "who": "Matt", "text": "Yeah. They have no idea what their job— what— what their degree trains them for. Because at least in non-STEM majors, let's say, your degree is not pertinent to the type of work that you will be doing in your career."}, {"t": 6732, "who": "Matt", "text": "It has very— yeah. So, like, it's kind of useless."}, {"t": 6734, "who": "Matt", "text": "One thing that I really like is in some Western societies, they do a gap year between high school and college. And so the."}, {"t": 6742, "who": "Mark", "text": "Yeah."}, {"t": 6743, "who": "Matt", "text": "The purpose of the gap years, I mean, of course, like, have fun and stuff, but it's really— it's to explore. You don't know what the options are. Like, let's say right now, AI is extremely popular, okay?"}, {"t": 6753, "who": "Mark", "text": "Yeah."}, {"t": 6753, "who": "Matt", "text": "And so you have all these people that are training to be doctors. They don't even know what AI is. They don't know that by the time they're done being a doctor, their job doesn't exist, because AI already does it."}, {"t": 6761, "who": "Matt", "text": "But if you took a gap year, you would be learning, \"Oh, there's this other thing. It's this new up-and-coming AI.\""}, {"t": 6767, "who": "Matt", "text": "Like, even— even 10 years from now, after AI is normal in everyday life, there's going to be another thing. And unless you have time to sit down and really reflect on what is happening in society, what is happening in your own life, you're just going to be part of another machine."}, {"t": 6782, "who": "Matt", "text": "And it would be better if part of the machine was, \"Oh, we need, like, a rest period. We have downtime.\""}, {"t": 6789, "who": "Matt", "text": "Even real machines, you have to, like, have maintenance, right?"}, {"t": 6792, "who": "Mark", "text": "Downtime. Yeah."}, {"t": 6793, "who": "Matt", "text": "Yeah. But there is no downtime in the Taiwanese machine."}, {"t": 6798, "who": "Mark", "text": "I agree. I mean, gap year is a very crucial year for you to observe. Yeah."}, {"t": 6805, "who": "Mark", "text": "Because like— like I said, we don't have downtime. We— we don't— downtime for me means time to observe."}, {"t": 6814, "who": "Mark", "text": "So we don't have time to observe. We are screwed."}, {"t": 6817, "who": "Mark", "text": "We— we just study and work, and we're tired. And sometimes— and in the— nowadays, AI are going to take million people's job, right?"}, {"t": 6829, "who": "Mark", "text": "So you don't even have a job to do, and you— how can you retire even though your plan is to work and retire? You don't even have that option anymore."}, {"t": 6839, "who": "Matt", "text": "Even before AI, you see the stories about."}, {"t": 6843, "who": "Mark", "text": "Mass production."}, {"t": 6846, "who": "Matt", "text": "Not just that, but mass diplomas, let's say. So specifically in China, you see 高考 as, like, the most important thing in your life."}, {"t": 6855, "who": "Mark", "text": "Yeah."}, {"t": 6856, "who": "Matt", "text": "And then you see everybody graduates, and so many people have, you know, multiple PhDs, multiple masters. And at the end of the day, what are you doing? You're still— you're delivering for— for Grab, right?"}, {"t": 6869, "who": "Mark", "text": "Yeah."}, {"t": 6869, "who": "Matt", "text": "Because you— you never have the opportunity to say, like, \"Where is the job?\" Like, the job was never the goal. Like, the career was never the goal."}, {"t": 6878, "who": "Matt", "text": "The goal was always to graduate. But, like, for what purpose?"}, {"t": 6882, "who": "Mark", "text": "In Taiwan, I don't know about China, so I cannot speak on their behalf. So I can only speak on behalf of the society I live in right now, right?"}, {"t": 6893, "who": "Matt", "text": "Okay."}, {"t": 6897, "who": "Mark", "text": "Based on my experience talking to so many different— my classmates back in my college, I think 90%, even in the Department of Physics, is true too. They want to graduate more than anything. So it's true."}, {"t": 6914, "who": "Mark", "text": "Like you say, I think the important skill that we should actually care about is how to solve the problem, how to build out a way to solve the problem. And I think that's what the Department of Physics can offer people."}, {"t": 6933, "who": "Mark", "text": "But even physics students don't care about that."}, {"t": 6940, "who": "Mark", "text": "They want to graduate because that's the most efficient way to go into the workplace."}, {"t": 6948, "who": "Matt", "text": "Hmm."}, {"t": 6948, "who": "Mark", "text": "But what else for? Yeah."}, {"t": 6952, "who": "Matt", "text": "All right. I want to— I want to end this discussion with one more thought."}, {"t": 6955, "who": "Mark", "text": "Yeah. Yeah."}, {"t": 6956, "who": "Matt", "text": "The thought that you asked me, \"Is poverty a disease?\""}, {"t": 6961, "who": "Mark", "text": "Yeah."}, {"t": 6962, "who": "Matt", "text": "And I actually— I said that poverty is a self-inflicted disease. And I actually think that if— okay, like, both you and I are very privileged, okay? We're in a different place in our life."}, {"t": 6976, "who": "Matt", "text": "I'm not talking about every single person in Taiwan, every single person in the world. I'm talking about people."}, {"t": 6982, "who": "Mark", "text": "Yeah."}, {"t": 6982, "who": "Matt", "text": "In our situation."}, {"t": 6983, "who": "Mark", "text": "Yeah."}, {"t": 6984, "who": "Matt", "text": "I think that you could— you should aspire to be in poverty, okay? So you— you change the definition of poverty. What does poverty mean?"}, {"t": 6997, "who": "Matt", "text": "I don't know. But if you aspire to be in poverty, you simplify your life a lot."}, {"t": 7004, "who": "Matt", "text": "So why are we in poverty? Why do we have debt?"}, {"t": 7008, "who": "Matt", "text": "It's usually because we're spending money that we don't have, and so we have to do additional work that we don't want to do to pay for it. So if you look at, like, Buddhism, you know, you have a lot of monks."}, {"t": 7020, "who": "Matt", "text": "What— what do they want? They want nothing."}, {"t": 7024, "who": "Matt", "text": "Okay? Now, that— that is, of course, that is an extreme."}, {"t": 7027, "who": "Matt", "text": "That is an extreme. And I'm not saying that that's what you need to do."}, {"t": 7030, "who": "Matt", "text": "But what I am saying is, you need to realize that your own situation, such as working 60 hours a week, 80 hours a week for not enough money or whatever, a lot of times it's because you want something externally and not internally."}, {"t": 7051, "who": "Matt", "text": "And so it's not always a physical good. It's not, \"Oh, I want to buy the newest iPhone,\" okay?"}, {"t": 7057, "who": "Matt", "text": "Externally can also mean, \"I want to meet my parents' expectation.\""}, {"t": 7061, "who": "Mark", "text": "Yeah. Yeah."}, {"t": 7063, "who": "Matt", "text": "And so if you never have the time to understand yourself, you don't know that you— what you value. Do you value meeting your parents' expectation? No, but, like, I have to because everybody does it, right?"}, {"t": 7076, "who": "Matt", "text": "It's— you know, if— if— if your purpose is, \"I want to bring my parents happiness, and this is the best way to do that,\" then, okay, fine."}, {"t": 7085, "who": "Mark", "text": "But you are not going to reach the end if that's your motivation, based on my experience."}, {"t": 7093, "who": "Matt", "text": "Yeah. Because like we said with the wavelength before, with the depression thing, the only way to get over depression is to decide to get over depression."}, {"t": 7104, "who": "Matt", "text": "And so your appeasement, your purpose, and stuff like that, it has to come from internal. You have to decide for yourself."}, {"t": 7112, "who": "Matt", "text": "It's not, \"I want to do this for my mom.\" It's, \"I'm doing this for me.\""}, {"t": 7118, "who": "Matt", "text": "Oh, yeah, my mom also wants this. And so it's really hard to differentiate who you are as an individual versus who you are as a cog in the machine."}, {"t": 7130, "who": "Mark", "text": "Yeah. Yeah. I— I know our time is running out, but there's one last thing I— I recently experienced, and I heard it before, but I personally experienced it, so this is different right now."}, {"t": 7148, "who": "Mark", "text": "Back when I was a kid, I heard that you got to find your passion. And because if it's your passion, you are going to do it, even though it takes— it takes a lot to do it, you— you will still do it."}, {"t": 7166, "who": "Mark", "text": "And you are going to be successful because you are passionate about this field. And I agree as a kid, but I never experienced myself."}, {"t": 7176, "who": "Mark", "text": "But right now, because my life is basically about studying and talking to my friend, and I'm with my friend and catch some Pokémon. And I— I— I become more— I think during these past few months, I understand myself better because I— I think if I keep doing something I don't enjoy, I— I— I would simply pass the minimum, but I would never become— I don't even know what to say that in— in Chinese, but if this is not something I— I actually care about, I'm not going"}, {"t": 7239, "who": "Mark", "text": "to do it well. Yeah."}, {"t": 7242, "who": "Matt", "text": "Okay."}, {"t": 7242, "who": "Mark", "text": "As a kid, I heard it and I understand it, but right now I experience it, and I think that it's different right now. So this actually reminds me of my friend who is also a doctor now, and also he was a physics major like me, like I was. And he is 34 or 35 years old right now, and he is in his second year of residency."}, {"t": 7274, "who": "Mark", "text": "Yeah. And he said when he graduated from college, and he— he has two different paths laying ahead of him."}, {"t": 7286, "who": "Mark", "text": "One is going for master's and go for semiconductors to work as an engineer. It is the first path, the ordinary one."}, {"t": 7297, "who": "Mark", "text": "And he's— and he's able to— he was able to do that. And the second one is he wants to become a doctor, like I did right now, like what I do right now."}, {"t": 7309, "who": "Mark", "text": "And he struggled for one week, and he tried to do it both ways to prepare for both paths for one week. And after that one week, because you know we have a lot of friends who are in Taiwan, right?"}, {"t": 7323, "who": "Mark", "text": "He burned all the material from the crane school for his master's degrees. He burned it because he— he said, \"I don't give a fuck anymore.\""}, {"t": 7334, "who": "Mark", "text": "It's not because he wasn't able to study it. He just felt he don't want to waste a single— a single second of his life on those stuff."}, {"t": 7345, "who": "Mark", "text": "Because he said, \"I'm not going to do all those shit. I'm going to do— go— going to prepare for med school to become a doctor.\""}, {"t": 7355, "who": "Mark", "text": "So now he is a doctor. And I think this is so true because— because you— you can tell by— by the act he's burning all those material."}, {"t": 7373, "who": "Mark", "text": "It's a very strong act, right?"}, {"t": 7376, "who": "Matt", "text": "Yeah."}, {"t": 7376, "who": "Mark", "text": "You can just throw it away. He— he literally burned it. So— so he— he— he knows deep— deep in his heart, he doesn't enjoy studying physics anymore."}, {"t": 7390, "who": "Mark", "text": "He doesn't enjoy those, let's say, semiconductors, let's say, energy, and mechanics. He doesn't care anymore."}, {"t": 7405, "who": "Mark", "text": "So I mean, even though he forced himself to do it, he would probably be accepted and got enrolled into 台大, NTU, or 清大. He— he was already 清大, so he was good."}, {"t": 7421, "who": "Mark", "text": "He— he would probably be accepted. But after he graduated, I don't think he's going to work because he don't enjoy it."}, {"t": 7430, "who": "Mark", "text": "He didn't enjoy it. So I mean, it's— it's so real."}, {"t": 7434, "who": "Mark", "text": "He burned those materials, and he turned his— he switched his career to become a doctor. So right now he works as a doctor."}, {"t": 7444, "who": "Mark", "text": "So I mean, what we were talking about here, I mean, so many people spend their whole life— they didn't actually make a decision. So that's— so that's— I think that's so real."}, {"t": 7458, "who": "Mark", "text": "Yeah."}, {"t": 7459, "who": "Matt", "text": "Yeah, yeah. I think for sure. He probably is even a better doctor than others because he has such a strong stance for it."}, {"t": 7472, "who": "Mark", "text": "No. He— he said he's stuck right now."}, {"t": 7475, "who": "Matt", "text": "Yeah, he's stuck."}, {"t": 7477, "who": "Mark", "text": "He's stuck right now. I— I went to Taizong, like, five months ago to— to have a dinner with him, and he said, \"Sometimes—\" because he is in his second year of residency, right? And he said, \"Sometimes because how— how— how inexperienced they are, sometimes the hospital don't care."}, {"t": 7501, "who": "Mark", "text": "And because they lack of experience, and their seniors do not have all day to look after them, so they sometimes make mistakes and the patients are dead because of them.\" That happens."}, {"t": 7514, "who": "Mark", "text": "So— so he— he said he's stuck right now. But— but I would say it's just process."}, {"t": 7521, "who": "Mark", "text": "So he— he— he still can improve, I guess. And the way he prayed is, \"The patient just died.\""}, {"t": 7529, "who": "Mark", "text": "That's so funny. Yeah."}, {"t": 7532, "who": "Mark", "text": "Yeah."}, {"t": 7534, "who": "Matt", "text": "All right. I want to leave with one more quote."}, {"t": 7537, "who": "Mark", "text": "Yeah."}, {"t": 7538, "who": "Matt", "text": "Okay?"}, {"t": 7538, "who": "Mark", "text": "Okay."}, {"t": 7539, "who": "Matt", "text": "\"So stress is what you do for someone else.\""}, {"t": 7544, "who": "Mark", "text": "Yeah."}, {"t": 7544, "who": "Matt", "text": "\"Compassion is what you do for yourself.\""}, {"t": 7547, "who": "Mark", "text": "Yeah, true."}, {"t": 7548, "who": "Matt", "text": "It's the same thing."}, {"t": 7550, "who": "Mark", "text": "Yeah."}, {"t": 7551, "who": "Matt", "text": "Yeah. It's just the perspective."}, {"t": 7554, "who": "Mark", "text": "Okay. The same thing about how we view it and how we digest it, right?"}, {"t": 7559, "who": "Matt", "text": "Yeah."}, {"t": 7560, "who": "Mark", "text": "Okay. It's good. Okay."}, {"t": 7564, "who": "Mark", "text": "I— I hope you— you stay safe because typhoon in Taoyuan is also strong, and I don't dare to go out today."}, {"t": 7572, "who": "Matt", "text": "Oh, I'm going to go out right now."}, {"t": 7575, "who": "Mark", "text": "Take care."}, {"t": 7576, "who": "Matt", "text": "I love—"}, {"t": 7577, "who": "Mark", "text": "Take care— can you show me how Kaohsiung is right now?"}, {"t": 7581, "who": "Matt", "text": "It looks completely normal. There's nothing. Like, there was a wind before, but right now there's nothing."}, {"t": 7586, "who": "Mark", "text": "Yeah. But— but I don't dare to go out in— in Taoyuan today. But I'm asking for my friend to come to my place."}, {"t": 7595, "who": "Mark", "text": "I don't care. Please don't go out."}, {"t": 7597, "who": "Mark", "text": "You come here."}, {"t": 7601, "who": "Matt", "text": "At least you have to buy him food."}, {"t": 7603, "who": "Mark", "text": "Yeah. No, they have to bring me pizza."}, {"t": 7607, "who": "Matt", "text": "All right. So in conclusion, let's go over this session."}, {"t": 7611, "who": "Mark", "text": "Yeah."}, {"t": 7612, "who": "Matt", "text": "The goal was to digest this novel."}, {"t": 7618, "who": "Mark", "text": "Yeah."}, {"t": 7619, "who": "Matt", "text": "And then to talk about it. And so let's say the process of you reading the book, was it enjoyable for you? Did it achieve your goal of becoming just better at reading English?"}, {"t": 7634, "who": "Mark", "text": "I would say it was painful. Honestly, it was painful, but it helps. So if your question is, do I enjoy it?"}, {"t": 7643, "who": "Mark", "text": "No, I— I think that actually put some burden on me. I— I wouldn't say it's stress, but it was painful."}, {"t": 7651, "who": "Mark", "text": "And— but I think what I'm about to do in the following week, because I already read the novel, right, so I still have memory of this."}, {"t": 7666, "who": "Mark", "text": "I know the plot, so I'm going to play the audiobook when— where I— where I— and in my bed. So I remember how I developed my Chin— Chinese when I was a kid."}, {"t": 7683, "who": "Mark", "text": "We have— we had café, right? So we played café that talked about science stuff."}, {"t": 7692, "who": "Matt", "text": "Yeah."}, {"t": 7694, "who": "Mark", "text": "When we were in bed. And it was always the same café or those same few cafés. So— but by repeating those same stories, those same plots, I become more familiar with Chinese, right?"}, {"t": 7716, "who": "Mark", "text": "So I think the metaphor is the same because I already read the novel with the audiobook. So I'm going to play the audio— audiobook."}, {"t": 7729, "who": "Mark", "text": "Let's say five days or six days and pay attention to it until I fall asleep. I mean, become like child— childish, right?"}, {"t": 7740, "who": "Matt", "text": "Mm-hmm."}, {"t": 7741, "who": "Mark", "text": "It's also one way to become childish because we— we all did that as a kid. So it's also become childish. Yeah."}, {"t": 7748, "who": "Matt", "text": "Okay. So do you want to do this again in the future?"}, {"t": 7757, "who": "Matt", "text": "And if so, do you want to do this with the same book or with a different book?"}, {"t": 7764, "who": "Mark", "text": "I really don't know because— hey, mate, I— I— I think we— we can be honest— honest with each other, right?"}, {"t": 7773, "who": "Matt", "text": "Yeah."}, {"t": 7773, "who": "Mark", "text": "I— I mean, I don't— I don't feel stressed talking to you, right? I actually— I— I— I don't want to sound fake. I don't want to sound fake, but— but I— but— but my time is actually quite tight."}, {"t": 7798, "who": "Mark", "text": "And it's not because I cannot take pressure. It's— it's theoretically, my time is allocated for so many different things."}, {"t": 7811, "who": "Mark", "text": "And— and also because the extent is counting."}, {"t": 7818, "who": "Mark", "text": "It's less than 100 days. And I— I think I have to put in all my focus and attention into it."}, {"t": 7831, "who": "Mark", "text": "And— but I also feel because we— we actually find a way to— to keep the conversation alive, right?"}, {"t": 7845, "who": "Matt", "text": "Mm-hmm."}, {"t": 7848, "who": "Mark", "text": "I mean, I love— I love your story, obviously."}, {"t": 7852, "who": "Matt", "text": "Yeah. What we can do is just change the material to the stuff that you're studying."}, {"t": 7858, "who": "Mark", "text": "Oh."}, {"t": 7862, "who": "Mark", "text": "Biology?"}, {"t": 7863, "who": "Matt", "text": "Well, I— I have helped. Like, my— my sister, when she was testing for her residency or— no, it was after residency."}, {"t": 7875, "who": "Matt", "text": "So basically, she had case studies. Oh, when she was— she was testing for her anesthesia boards, okay?"}, {"t": 7885, "who": "Mark", "text": "What's that?"}, {"t": 7886, "who": "Matt", "text": "Anesthesia."}, {"t": 7888, "who": "Mark", "text": "Oh, in— oh, okay."}, {"t": 7889, "who": "Matt", "text": "For her board."}, {"t": 7890, "who": "Mark", "text": "For her board."}, {"t": 7890, "who": "Matt", "text": "Yeah. For her board. So basically, she made, like, flashcards, and then she was actually working on an app just recently of how do you go over case studies in order to get the conclusion that you need."}, {"t": 7906, "who": "Matt", "text": "So— so for her boards, basically, you're a doctor, you go in, you read the sheets, you understand what the patient is, and then you have to articulate, \"This is the decision-making that I'm— I'm doing because of XYZ reasons.\" And so, like, you're still studying the same thing."}, {"t": 7922, "who": "Matt", "text": "Like, you're studying— if the topic is biology, that's okay. If the topic is, like, whatever it is for your medical school application, we can just shift the topic to that, and then— yeah, it's the same thing."}, {"t": 7938, "who": "Mark", "text": "But it was all in Chinese."}, {"t": 7942, "who": "Matt", "text": "Yeah, but I—"}, {"t": 7943, "who": "Mark", "text": "Yeah."}, {"t": 7943, "who": "Matt", "text": "I'll just talk to you in English."}, {"t": 7945, "who": "Mark", "text": "Okay. So all I— I have to do was to translate those terms into English so we can talk, right?"}, {"t": 7956, "who": "Matt", "text": "Yeah."}, {"t": 7958, "who": "Mark", "text": "Oh. I think that's not too hard. Yeah."}, {"t": 7961, "who": "Mark", "text": "I— I— I think maybe that can also help me strengthen my— my memory— my memory about all those stuff, right? I— I think that's helpful."}, {"t": 7975, "who": "Matt", "text": "What— what is the current method that you're using to study for your medical entrance exam?"}, {"t": 7982, "who": "Mark", "text": "Actually, I— I just kept doing mock exams. And if I got one question wrong, I go back to my— my book. So that's my method."}, {"t": 7994, "who": "Matt", "text": "Okay. If you send me the— if you send me the material for testing for Taiwanese medical school, I can— I can digest it and turn it into a conversation."}, {"t": 8014, "who": "Mark", "text": "Really?"}, {"t": 8015, "who": "Matt", "text": "It's easy for me."}, {"t": 8016, "who": "Mark", "text": "Really? You— you have all those biology knowledge?"}, {"t": 8024, "who": "Matt", "text": "I have— I have as much biology knowledge as I had about Piper in the Woods."}, {"t": 8032, "who": "Mark", "text": "Okay. I see what you're doing right now here. I think we can try."}, {"t": 8037, "who": "Mark", "text": "I can send you all those stuff. And I think with the help of AI, it will be much easier than 10 years ago."}, {"t": 8044, "who": "Mark", "text": "Yeah. Yeah."}, {"t": 8045, "who": "Matt", "text": "Yeah."}, {"t": 8046, "who": "Mark", "text": "If— if you only can work. Yeah."}, {"t": 8048, "who": "Matt", "text": "Yeah. Don't give me the material that you're studying, okay?"}, {"t": 8051, "who": "Mark", "text": "Oh."}, {"t": 8052, "who": "Matt", "text": "Give me the material of the exam."}, {"t": 8056, "who": "Mark", "text": "Oh. I think that's easy for me to do. Yeah."}, {"t": 8062, "who": "Mark", "text": "Yeah. I think that's very creative."}, {"t": 8066, "who": "Mark", "text": "I— I think we can certainly do that."}, {"t": 8070, "who": "Matt", "text": "Yeah."}, {"t": 8070, "who": "Mark", "text": "I— I never thought you would say that, actually. Yeah."}, {"t": 8074, "who": "Matt", "text": "Why not? I— I— I mean, yeah, it is not English tutoring, right? It's not English tutoring."}, {"t": 8081, "who": "Mark", "text": "It's not. It's not."}, {"t": 8082, "who": "Matt", "text": "But what is English tutoring? English tutoring is just a methodology to get you to speak better English."}, {"t": 8089, "who": "Mark", "text": "Uh-huh."}, {"t": 8090, "who": "Matt", "text": "And, like, this would not be my first time helping somebody do prepare for medical things."}, {"t": 8096, "who": "Mark", "text": "Really? You— you have done that before?"}, {"t": 8098, "who": "Matt", "text": "Yeah. I just— I just told you about my sister when she was going for her medical— for her anesthesia boards."}, {"t": 8105, "who": "Mark", "text": "Oh. So you actually help her with that. Yeah."}, {"t": 8108, "who": "Matt", "text": "Yeah."}, {"t": 8109, "who": "Mark", "text": "Oh. Cool. Cool."}, {"t": 8110, "who": "Mark", "text": "Cool. I think we can do that."}, {"t": 8113, "who": "Mark", "text": "I— I can send you the material right away, actually. Yeah."}, {"t": 8117, "who": "Matt", "text": "Yeah. Just send me the— the easiest thing would be if I could get a copy of the past five years of tests. That way, I can digest the formatting, all that kind of stuff, and I will devise a way to do this."}, {"t": 8134, "who": "Mark", "text": "Oh. I— I can send you one already, and I can send you, like, five years old or more."}, {"t": 8140, "who": "Matt", "text": "But the—"}, {"t": 8140, "who": "Mark", "text": "Anyway."}, {"t": 8141, "who": "Matt", "text": "Yeah. The topics would have to go very rapidly because we're not going to be talking, like, 15 minutes on one question, right?"}, {"t": 8149, "who": "Mark", "text": "No, no, no, no. Let's talk PBL. Do you know what PBL is?"}, {"t": 8153, "who": "Matt", "text": "I know what BBL is."}, {"t": 8155, "who": "Mark", "text": "PBL?"}, {"t": 8156, "who": "Matt", "text": "I don't know."}, {"t": 8159, "who": "Mark", "text": "It's problem solve lecture. It's actually a very small— sorry. It's actually a very small group of people."}, {"t": 8170, "who": "Mark", "text": "They actually gather in a very small classroom, and they're actually targeting a problem and try to understand why this problem happened and how is this problem affecting other parts of our body, and how do we combat against it. Yeah."}, {"t": 8189, "who": "Matt", "text": "Okay."}, {"t": 8189, "who": "Mark", "text": "It's called PBL lecture. PBL is problem solve lecture. It's a lecture in medical school."}, {"t": 8197, "who": "Mark", "text": "Yeah."}, {"t": 8197, "who": "Matt", "text": "In America, we just call this Doctor House."}, {"t": 8202, "who": "Mark", "text": "It's easy to understand. PBL, so much harder to understand."}, {"t": 8208, "who": "Matt", "text": "Okay. Okay."}, {"t": 8208, "who": "Mark", "text": "Yeah."}, {"t": 8209, "who": "Matt", "text": "Yeah. So let's give this a try, and that way you're doing two birds, one stone."}, {"t": 8219, "who": "Mark", "text": "Huh?"}, {"t": 8220, "who": "Matt", "text": "Two birds, one stone."}, {"t": 8222, "who": "Mark", "text": "Oh, yeah. Cool. Cool."}, {"t": 8223, "who": "Mark", "text": "Cool."}, {"t": 8224, "who": "Mark", "text": "一石二鸟。"}, {"t": 8225, "who": "Matt", "text": "Yeah."}, {"t": 8226, "who": "Mark", "text": "It's— I— I don't know. The slang is from Chin— Chinese or from English. I don't know where it is originally from."}, {"t": 8234, "who": "Mark", "text": "Yeah. Because that's the same thing."}, {"t": 8236, "who": "Mark", "text": "一石二鸟。 One stone, two birds. Okay."}, {"t": 8241, "who": "Mark", "text": "Cool."}, {"t": 8241, "who": "Matt", "text": "Okay. Then I will send me a lot of material. I need a lot of material to digest."}, {"t": 8247, "who": "Mark", "text": "My five-year, six-year, or— or more you ask for years, I can give it then to you."}, {"t": 8253, "who": "Matt", "text": "Yeah."}, {"t": 8253, "who": "Mark", "text": "Yeah."}, {"t": 8253, "who": "Matt", "text": "Yeah. And then I'll see the form. Yeah."}, {"t": 8256, "who": "Matt", "text": "We'll figure this out, and then I'll think of another way to do these conversations. I already have an idea of what to do."}, {"t": 8265, "who": "Matt", "text": "It's going to look very, very ugly, though, physically, but it will— it will get the job done."}, {"t": 8271, "who": "Mark", "text": "Yeah. And— but sometimes I— I try to translate all those terminology, but maybe I will lose one or two. So if I don't know— don't know terminology."}, {"t": 8284, "who": "Mark", "text": "For example, CGL. I don't know what that is."}, {"t": 8287, "who": "Mark", const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let stopAt=null,curBtn=null,try_=false,kind='all',topic=null;

function play(t,label,btn,end){a.currentTime=Math.max(0,t+OFF-2);stopAt=end!=null?end+OFF:null;a.play();document.getElementById('nowt').textContent=label;if(curBtn)curBtn.classList.remove('on');curBtn=btn||null;if(btn)btn.classList.add('on')}

a.onplay=()=>document.getElementById('pp').textContent='❚❚';a.onpause=()=>{document.getElementById('pp').textContent='▶';if(curBtn){curBtn.classList.remove('on')}};
a.ontimeupdate=()=>{if(stopAt&&a.currentTime>=stopAt){a.pause();stopAt=null}document.getElementById('clock').textContent=fmt(a.currentTime-OFF)+' into the talk';if(a.duration)document.getElementById('fill').style.width=(100*a.currentTime/a.duration)+'%'};
document.getElementById('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(a.duration){a.currentTime=a.duration*(e.clientX-r.left)/r.width;stopAt=null}};

function topics(){document.getElementById('topics').innerHTML=D.sections.map((s,i)=>{const n=D.moments.filter(m=>m.sec===i).length;return `<button class="topic${topic===i?' on':''}" data-i="${i}"><span class="t">${fmt(s.t)}</span><span>${esc(s.title)}</span>${n?`<span class="n">${n}</span>`:''}</button>`}).join('');

function renderFull(){const T=D.transcript;const has=new Set(D.moments.map(m=>m.t));let h='',si=-1;T.forEach((r,k)=>{const s=secOf(r.t);if(s!==si){si=s;const S=D.sections[s];h+=`<h3 class="sec" id="s${s}">${esc(S.title)}<small>${fmt(S.t)} · ${esc(S.summary)}</small></h3>`}

el.innerHTML=`<div class="card"><p style="margin-top:0"><b>What this shows.</b> The lesson was recorded two ways at once. Wispr kept each speaker on a separate channel. OBS recorded one track with both voices mixed together. Several speech-to-text tools listened to each, and an AI picked the most likely words where they disagreed. Below, the same minute is shown three ways so you can compare.</p><p class="note" style="margin-bottom:0">Wispr started about 3½ minutes late, so the first minutes exist only in the OBS mix. This is an unchecked draft: some words are wrong in every version, and Matt hasn’t corrected them yet.</p></div>`+
D.compare.map(c=>`<div class="card"><div class="head"><button class="play" data-c="${c.start}">▶ Hear this minute</button><span class="time">${fmt(c.start-OFF)} into the talk</span></div><div class="rec3">${['W','O','WO'].map(k=>`<div><h5>${lab[k]}</h5><div class="box">${c.cols[k].map(([s,t])=>`<p style="margin:0 0 6px"><span class="who ${s}">${s}</span> ${esc(t)}</p>`).join('')}</div></div>`).join('')}</div></div>`).join('');
el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const t=+b.dataset.c-OFF;a.currentTime=Math.max(0,t+OFF);stopAt=t+OFF+60;a.play();document.getElementById('nowt').textContent='Sample minute at '+fmt(t)})}
let view='pat';function show(v){view=v;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));['pat','mom','full','rec'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hidden',x!==v))}
