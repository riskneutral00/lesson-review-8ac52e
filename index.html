I was— I know how to do things, but I was a bit bugger or— or arrogant."}, {"t": 2451, "who": "Mark", "text": "Yeah. Because I was 27, so I— you— you cannot blame me."}, {"t": 2456, "who": "Mark", "text": "I was 27 only."}, {"t": 2459, "who": "Matt", "text": "Would— would it be considered direct?"}, {"t": 2463, "who": "Mark", "text": "Direct? Yes."}, {"t": 2464, "who": "Matt", "text": "Yeah, would you— would— okay, but would you say— would you differentiate vulgar from direct? Because there's a lot of people, they speak very direct without fluff, and so it comes off as offensive."}, {"t": 2475, "who": "Mark", "text": "Yeah. It hurts people. Yeah."}, {"t": 2477, "who": "Matt", "text": "Yeah, yeah. So you were— would you identify that you were vulgar, or that you were just direct? Short."}, {"t": 2486, "who": "Mark", "text": "I would say it's up to perspective. But I— I would personally say it's direct, but some people say it's vulgar. Yeah."}, {"t": 2495, "who": "Matt", "text": "Okay, okay. Yeah."}, {"t": 2496, "who": "Mark", "text": "Yeah, it's up to perspective. Yeah."}, {"t": 2498, "who": "Matt", "text": "是不是像，嗯，没有耐心的？"}, {"t": 2502, "who": "Mark", "text": "It's like Kobe, you know?"}, {"t": 2505, "who": "Matt", "text": "Huh? It's like what?"}, {"t": 2509, "who": "Mark", "text": "It's like Kobe. Kobe's teammates don't like him, right?"}, {"t": 2512, "who": "Matt", "text": "Oh, Kobe. Okay."}, {"t": 2514, "who": "Mark", "text": "Yeah, it's like Kobe. But it's not— it's not near the level of Kobe. But I would say I was striving for— for girls, and sometimes it knows other people's feelings."}, {"t": 2529, "who": "Mark", "text": "I lack of empathy sometimes. At that time."}, {"t": 2532, "who": "Matt", "text": "Yeah, yeah."}, {"t": 2533, "who": "Mark", "text": "Yeah. But right— not right now, because I grew more mature, so I try to care for other people's feelings right now. Yeah."}, {"t": 2541, "who": "Matt", "text": "Okay. Got it, got it. Okay."}, {"t": 2543, "who": "Mark", "text": "Yeah. And so— so she said I was too— sometimes too rude, and she sometimes got mad for me about it. She got upset about it."}, {"t": 2556, "who": "Mark", "text": "And— what did I even start with this girl?"}, {"t": 2562, "who": "Mark", "text": "I forgot."}, {"t": 2564, "who": "Matt", "text": "Yeah, you were just saying that you're going to go to her wedding, and the way that you were—"}, {"t": 2569, "who": "Mark", "text": "No, no, no. I'm not going to her wedding. I'm going to have a video call with her."}, {"t": 2575, "who": "Matt", "text": "Oh, video call. It's just—"}, {"t": 2576, "who": "Mark", "text": "Yeah."}, {"t": 2576, "who": "Matt", "text": "I guess you were saying that you— you have, like, some— you have happiness for her, but you also have some regret in yourself, in, like, the way that you were communicating."}, {"t": 2589, "who": "Mark", "text": "Before that, what— what did I—"}, {"t": 2591, "who": "Matt", "text": "Oh. Oh, you were talking about the different stages of your life, that you had first stage and then third stage. So actually— wait, I have a question that will lead up to that."}, {"t": 2602, "who": "Matt", "text": "That is."}, {"t": 2603, "who": "Mark", "text": "Yeah."}, {"t": 2604, "who": "Matt", "text": "In the book, Westerberg, he worked and studied for a lot of years to join the Patrol."}, {"t": 2611, "who": "Mark", "text": "Yeah."}, {"t": 2612, "who": "Matt", "text": "And then he wished that he became a plant sooner. And so."}, {"t": 2615, "who": "Mark", "text": "Yeah."}, {"t": 2616, "who": "Matt", "text": "Is that something that you think is a difference between your second and third part of your life? Is that how—"}, {"t": 2624, "who": "Mark", "text": "No. I— I think Westerberg said that he wanted to become a plant sooner."}, {"t": 2633, "who": "Mark", "text": "It's quite a different path from— from mine, because Westerberg becoming a plant means that he no longer needs to work."}, {"t": 2644, "who": "Matt", "text": "Okay, okay. Don't think of— sorry, don't think of a plant as, like, laziness per se. Think of a plant as just a— a pivot in your life."}, {"t": 2656, "who": "Mark", "text": "Okay."}, {"t": 2656, "who": "Matt", "text": "It doesn't have to be a pivot. So you— you go from what you were studying in school before to what you're going to study now. So before, you were studying physics, and then during your master's program, you made a pivot, and you decided, at some point, to go into medicine instead."}, {"t": 2677, "who": "Matt", "text": "So don't think that you go from Patrol to plant. Think that he goes from— yeah, you go from one thing to another."}, {"t": 2685, "who": "Mark", "text": "Yeah."}, {"t": 2685, "who": "Matt", "text": "Did you have, like, this sort of—"}, {"t": 2687, "who": "Mark", "text": "Oh."}, {"t": 2688, "who": "Matt", "text": "Is that where your life—"}, {"t": 2689, "who": "Mark", "text": "No."}, {"t": 2690, "who": "Matt", "text": "You were— not even that. Okay, okay."}, {"t": 2692, "who": "Mark", "text": "No. I think I heard across— I don't remember the exact word, but it's— it's about every decision in your life is right, right?"}, {"t": 2704, "who": "Matt", "text": "Okay. Yeah."}, {"t": 2705, "who": "Mark", "text": "Yeah. The reason— I— I believe the quote is accurate, because— okay, it's kind of— kind of profound."}, {"t": 2716, "who": "Mark", "text": "It's kind of deep. Every decision you make in your life is correct."}, {"t": 2722, "who": "Mark", "text": "It's the right decision."}, {"t": 2726, "who": "Mark", "text": "I—"}, {"t": 2727, "who": "Matt", "text": "I agree with this, by the way. No, no. I— I think you're right."}, {"t": 2729, "who": "Matt", "text": "So."}, {"t": 2730, "who": "Mark", "text": "Yeah."}, {"t": 2730, "who": "Matt", "text": "But I would preface this by saying that you can only feel that way if you understand that you have control over your life. A lot of people will blame other circumstances and say that they have no control."}, {"t": 2743, "who": "Mark", "text": "Yeah."}, {"t": 2744, "who": "Matt", "text": "And so whatever it is, they'll be like— they'll blame it on somebody else."}, {"t": 2749, "who": "Mark", "text": "Yeah."}, {"t": 2750, "who": "Matt", "text": "And so they can never have the attitude that whatever you're doing is right."}, {"t": 2753, "who": "Mark", "text": "Yeah."}, {"t": 2754, "who": "Matt", "text": "Because what we're saying is that right is defined by you."}, {"t": 2759, "who": "Mark", "text": "Yeah."}, {"t": 2759, "who": "Matt", "text": "So even if you're doing the wrong thing, even if you're committing crimes, okay, it is the right thing, because that is what you have decided to do, in this definition of what you're saying, whatever you do is right."}, {"t": 2769, "who": "Mark", "text": "Yeah."}, {"t": 2770, "who": "Matt", "text": "And I— and I agree. But you have to have a huge amount of personal responsibility to understand that."}, {"t": 2776, "who": "Mark", "text": "Yeah. Yeah, yeah. I would say if I study to switch my career, let's say I try to prepare for med school, I would probably be in my third or fourth year right now."}, {"t": 2791, "who": "Mark", "text": "And I would be so much better because I study— because I study as a physician so much earlier than I'm about to be, so that will grant me a much more advantage than I am right now, right?"}, {"t": 2806, "who": "Matt", "text": "Yeah."}, {"t": 2806, "who": "Mark", "text": "That makes sense. But if I switch my career earlier than I actually did, I would say I wouldn't even study the many grades school in Taichung, so that my— a lot of my experience would not be there, right? And also, I— I think if I actually switch physics so much earlier on, it wouldn't train my logical thinking, actually."}, {"t": 2844, "who": "Mark", "text": "And also, because I think during the training of physics, it helped me think clearly, and I believe that is the traits a lot of medical students do not have, do not even get a chance to experience. So I think— but that's that kind of experience going to help me become a good doctor?"}, {"t": 2871, "who": "Mark", "text": "I don't know. But it certainly helped me learn things more logically."}, {"t": 2879, "who": "Mark", "text": "And— and when I encounter a problem, I have— Sorry."}, {"t": 2885, "who": "Matt", "text": "No, I— I'm listening."}, {"t": 2886, "who": "Mark", "text": "Yeah. Oh, okay. So when I encounter a problem, I build a way to solve it, and I believe that is the ability most people don't have."}, {"t": 2899, "who": "Mark", "text": "So I wouldn't say I regret about my decision. I would say I wish I had more time and more wisdom to— to explore more things in shorter times."}, {"t": 2912, "who": "Matt", "text": "Yeah, yeah."}, {"t": 2912, "who": "Mark", "text": "But that's— that's all I can do."}, {"t": 2915, "who": "Matt", "text": "Yeah. I— I think— I think definitely. So I sent you something on Instagram just now."}, {"t": 2920, "who": "Matt", "text": "It's the name of a Chinese story. I don't know if you've read this before."}, {"t": 2925, "who": "Mark", "text": "Oh, I— I can take a look. Yeah. Oh, 赛龙司马."}, {"t": 2933, "who": "Mark", "text": "It means that you make a mistake, or you suffer some loss, but you gain— unexpectedly, you gain some— something in return."}, {"t": 2942, "who": "Matt", "text": "Yeah."}, {"t": 2943, "who": "Mark", "text": "Without knowing it."}, {"t": 2945, "who": "Matt", "text": "Yeah. So it's— it's like when something happens to you, good or bad, we don't really know if that itself is a good or bad thing. Until you have lived out your entire life, and you're like, \"Oh, okay, the accumulation of everything means it was a bad or a good thing.\""}, {"t": 2961, "who": "Matt", "text": "So, like, making a decision to switch majors at the time that you did, or instead of going directly into medicine, or whatever it is, I think a very— a very easy way to compare this is, unfortunately— like, I'm not picking on your friend. Your friend is getting married, right?"}, {"t": 2980, "who": "Mark", "text": "Yeah."}, {"t": 2980, "who": "Matt", "text": "But, like, we know statistically marriage ends almost 50% in divorce, right? And so."}, {"t": 2987, "who": "Mark", "text": "You already did suffer one before."}, {"t": 2989, "who": "Matt", "text": "Yeah. And so people that get married, you have to get married before you're 30 years old, or else you become a leftover girl, right? And."}, {"t": 2999, "who": "Mark", "text": "In Asia."}, {"t": 3000, "who": "Matt", "text": "Okay."}, {"t": 3001, "who": "Mark", "text": "Yeah, yeah. In some countries, yeah."}, {"t": 3003, "who": "Matt", "text": "Yeah. And so some people are very quick to get married. Some people are very quick to change careers."}, {"t": 3008, "who": "Matt", "text": "Some people are very quick to start a family, or whatever it is, because that's, like, the societal norm. And so we tell you, \"This is the correct thing to do.\""}, {"t": 3018, "who": "Matt", "text": "And then, you know, five years later, you're like, \"Wait, this was completely wrong. I didn't even know this person."}, {"t": 3024, "who": "Matt", "text": "I didn't know my situation. I didn't know anything.\""}, {"t": 3026, "who": "Matt", "text": "And so when you say, like, \"Oh, everything you do is the right choice,\" yeah, it's like getting married at 22 is the right choice. Getting married at 52 is the right choice."}, {"t": 3039, "who": "Matt", "text": "Whatever you do, but you have a lot more wisdom, hopefully. And, like— like you said, the analytical thought process of going through physics, while it might not help you directly in medicine, it's going to help you with decision-making in your life in general."}, {"t": 3056, "who": "Matt", "text": "And so just."}, {"t": 3058, "who": "Mark", "text": "How I build a system as well. How I build out a— let's say, ecosystem."}, {"t": 3065, "who": "Matt", "text": "Yeah."}, {"t": 3066, "who": "Mark", "text": "Yeah. How I build out an ecosystem, maybe I then know the ability during my pursuit of physics, right? Yeah."}, {"t": 3073, "who": "Matt", "text": "Yeah. Yeah. Okay."}, {"t": 3076, "who": "Matt", "text": "So going back to you said that your life is separated into three parts. So."}, {"t": 3082, "who": "Mark", "text": "Yeah."}, {"t": 3082, "who": "Matt", "text": "At what point did you go from the second to the third part?"}, {"t": 3086, "who": "Mark", "text": "I would say right— exactly when I moved back to Taoyuan."}, {"t": 3093, "who": "Matt", "text": "Okay."}, {"t": 3094, "who": "Mark", "text": "Let's say one and a half years ago. Yeah."}, {"t": 3097, "who": "Matt", "text": "Okay. Yeah. And I think life is kind of like a sine wave, right?"}, {"t": 3105, "who": "Matt", "text": "Like, it's not a linear process. It goes up and down, up and down, and then you can choose."}, {"t": 3110, "who": "Mark", "text": "Yeah."}, {"t": 3111, "who": "Matt", "text": "The frequency that you're going to change it to."}, {"t": 3113, "who": "Mark", "text": "Yeah. Yeah."}, {"t": 3116, "who": "Matt", "text": "Okay. Cool. And then what would the story at the end of your third chapter look like?"}, {"t": 3125, "who": "Matt", "text": "Does it go into a fourth chapter, or is it just the third chapter all the way through your life?"}, {"t": 3133, "who": "Mark", "text": "I— I wouldn't say— I wouldn't say the third chapter will last long. But before that, I— I— I would actually echo how your friend— how we change our frequency. You know a little bit about physics, right?"}, {"t": 3150, "who": "Matt", "text": "Yeah."}, {"t": 3150, "who": "Mark", "text": "A little bit, more or less. You know, when— when a wave— when a wave goes into a different medium."}, {"t": 3158, "who": "Matt", "text": "Yeah."}, {"t": 3159, "who": "Mark", "text": "It doesn't change the frequency. It— it only changes the lambda, right? You know that, right?"}, {"t": 3166, "who": "Matt", "text": "Yeah."}, {"t": 3167, "who": "Mark", "text": "So I love how your friend— our— our status. We can change our frequency when we want. It means that we become a different wave, or we— we launch a different wave."}, {"t": 3185, "who": "Mark", "text": "I— I'm sure it's not how we say it in English, but we have a different wave, a new wave."}, {"t": 3191, "who": "Matt", "text": "Yeah."}, {"t": 3191, "who": "Mark", "text": "So it's a different frequency. So I love how— how your friend is."}, {"t": 3196, "who": "Matt", "text": "Yeah, yeah. I definitely agree. It's."}, {"t": 3198, "who": "Mark", "text": "Along the way, we have a new wave, right?"}, {"t": 3201, "who": "Matt", "text": "Yeah. When we look at, like, dopamine, you can say, like, the highest high you ever get. Like, that's— like, that's the biggest delta in your frequency versus depression."}, {"t": 3214, "who": "Matt", "text": "And so I— I believe, just like you said, like, every— everything you do in life is the right— is the right thing. I also think that, like, 90% of the time, what you are doing is what you want to do."}, {"t": 3227, "who": "Matt", "text": "There are, of course, exceptions where, like, you are a victim of a circumstance where you have no choice."}, {"t": 3234, "who": "Mark", "text": "Right."}, {"t": 3234, "who": "Matt", "text": "But if you want to be— if, yeah, if you want to be depressed, like, you know, the frequency is as low as it gets, it can keep on going lower if you want it to go lower, and only you can make it stop."}, {"t": 3249, "who": "Mark", "text": "Yeah. Yeah."}, {"t": 3251, "who": "Matt", "text": "Yeah. So."}, {"t": 3255, "who": "Matt", "text": "Okay. And then so you were saying that, like, this— this current chapter that you're in, what— it— it might be a short chapter."}, {"t": 3266, "who": "Matt", "text": "Maybe it's just— this chapter is just getting into the medical school, and then the next chapter is, what are you doing in med school and afterwards? Yeah."}, {"t": 3275, "who": "Mark", "text": "Yeah. Yeah. Obviously."}, {"t": 3278, "who": "Matt", "text": "Yeah. So— so that's why— that's why you have to change the wavelength of your life. You're like, \"Okay, well, this part is— is condensed.\""}, {"t": 3288, "who": "Mark", "text": "Yeah."}, {"t": 3288, "who": "Matt", "text": "And then the other part is, you know, more elongated."}, {"t": 3291, "who": "Mark", "text": "Yeah."}, {"t": 3292, "who": "Matt", "text": "I think."}, {"t": 3292, "who": "Mark", "text": "It's like a short stop only, right?"}, {"t": 3295, "who": "Matt", "text": "It's like what?"}, {"t": 3296, "who": "Mark", "text": "It's like only, like, short stop."}, {"t": 3299, "who": "Matt", "text": "Short stop. Yeah. Yeah."}, {"t": 3300, "who": "Mark", "text": "Yeah."}, {"t": 3301, "who": "Matt", "text": "I feel the same. I mean, that's— that's why I have, like, I must be on my fifth life. I— I'm."}, {"t": 3309, "who": "Mark", "text": "You can chill a little bit too."}, {"t": 3311, "who": "Matt", "text": "Yeah, yeah. Our people can get very short. Yeah."}, {"t": 3313, "who": "Matt", "text": "Okay. So let me see a random question about the book."}, {"t": 3318, "who": "Matt", "text": "Let's see. Let's see."}, {"t": 3319, "who": "Mark", "text": "Okay."}, {"t": 3324, "who": "Matt", "text": "Okay. So Watt says that the station is a machine, and nobody has the right to leave."}, {"t": 3332, "who": "Mark", "text": "Oh."}, {"t": 3333, "who": "Matt", "text": "So what do you— yeah, what do you think about the way that he says this?"}, {"t": 3337, "who": "Mark", "text": "Okay. It's a very interesting question, because I believe in Asia, the burden on you from being absent in your job is more severe, right? And— and also, I'm right now absent from my job."}, {"t": 3362, "who": "Mark", "text": "So it's a very interesting question."}, {"t": 3366, "who": "Matt", "text": "Wait. Let's— let's relate this to a different type of machine that we talked about last time we talked. When we had the debate about the government subsidy for adult."}, {"t": 3380, "who": "Mark", "text": "Financial subsidy."}, {"t": 3381, "who": "Matt", "text": "Parents to take care of their parents, right?"}, {"t": 3383, "who": "Mark", "text": "Yeah."}, {"t": 3383, "who": "Matt", "text": "So part of the Asian machine is your parents take care of you growing up. You take care of them."}, {"t": 3390, "who": "Mark", "text": "Yeah."}, {"t": 3390, "who": "Matt", "text": "When they are old, right?"}, {"t": 3392, "who": "Mark", "text": "Yeah."}, {"t": 3393, "who": "Matt", "text": "This is a cycle. It's a machine. All right?"}, {"t": 3395, "who": "Mark", "text": "Yeah."}, {"t": 3395, "who": "Matt", "text": "And so let's say Watt says, \"This machine, you don't have the right to leave it. You need to take care of your parents when they're old.\""}, {"t": 3403, "who": "Mark", "text": "Yeah."}, {"t": 3404, "who": "Matt", "text": "So what do you think about this? Because this is almost exclusively, like, Asian and maybe, like, South American cultures, you know?"}, {"t": 3416, "who": "Mark", "text": "Mmm."}, {"t": 3416, "who": "Matt", "text": "Like, most Western cultures don't— they believe in high independence."}, {"t": 3420, "who": "Mark", "text": "Yeah. Yeah, yeah."}, {"t": 3422, "who": "Matt", "text": "Okay. So this is a type of machine, right?"}, {"t": 3424, "who": "Mark", "text": "Yeah."}, {"t": 3427, "who": "Mark", "text": "So what do I think about this, right?"}, {"t": 3429, "who": "Matt", "text": "Yeah. Do you— do you think— okay. First, do you think that this is a machine, at least in, let's say, Taiwan culture?"}, {"t": 3436, "who": "Matt", "text": "And then what do you think about leaving the machine? Because there are— there are more and more old people, fewer young people, and everyone is displacing."}, {"t": 3446, "who": "Matt", "text": "People are leaving."}, {"t": 3447, "who": "Mark", "text": "Lower birth rate. Yeah."}, {"t": 3448, "who": "Matt", "text": "Yeah. And maybe— I don't know what the adult healthcare looks like in Taiwan, but maybe in America you have a lot of nursing homes, a lot of, \"I don't have time for my parents, so I just throw them somewhere.\" So."}, {"t": 3460, "who": "Mark", "text": "Yeah, yeah."}, {"t": 3461, "who": "Matt", "text": "So that's how— that's one way to escape the machine, right?"}, {"t": 3464, "who": "Mark", "text": "We do have that too. Yeah."}, {"t": 3466, "who": "Matt", "text": "But how— how big is that in Taiwan?"}, {"t": 3468, "who": "Mark", "text": "I would say pretty huge."}, {"t": 3470, "who": "Matt", "text": "Okay."}, {"t": 3470, "who": "Mark", "text": "And it's still market to explore. Yeah."}, {"t": 3474, "who": "Matt", "text": "Okay."}, {"t": 3475, "who": "Mark", "text": "You can Google it. It's called 领口养生村. I— I can— actually, I can send you a link."}, {"t": 3483, "who": "Mark", "text": "I— I know you want— you— you want to do business. You want to make money, so."}, {"t": 3488, "who": "Matt", "text": "Yeah. I'm— I'm just."}, {"t": 3488, "who": "Mark", "text": "So you better know— so you better know about this. Or just for fun, you can learn this. Yeah."}, {"t": 3494, "who": "Matt", "text": "Yeah."}, {"t": 3495, "who": "Mark", "text": "领口养生村."}, {"t": 3509, "who": "Mark", "text": "领口养生村."}, {"t": 3517, "who": "Mark", "text": "Yeah. It's a village for— for old people, but it's very modern, and you have to pay, let's say, based on what I have heard, 40."}, {"t": 3532, "who": "Matt", "text": "这个是桃园的领口吗？"}, {"t": 3533, "who": "Mark", "text": "Yeah. Yeah, yeah."}, {"t": 3534, "who": "Matt", "text": "Oh, okay, okay, okay."}, {"t": 3536, "who": "Mark", "text": "Yeah. So I live in Taoyuan, so I know it well. And the— the business is started by Wang Yongqin, who is more rich than a billionaire."}, {"t": 3547, "who": "Mark", "text": "I— I don't know the word, because— yeah, can you tell me the word? Trillionaire."}, {"t": 3553, "who": "Matt", "text": "Elon Musk. Elon Musk is the only person richer than a billionaire."}, {"t": 3556, "who": "Mark", "text": "Okay. So he was like Elon Musk back in '80s in Taiwan, and he— he can actually overthrow half of China. I mean, not Taiwan."}, {"t": 3567, "who": "Mark", "text": "He can overthrow half of China back in that time. He was so rich."}, {"t": 3571, "who": "Mark", "text": "At that level, yeah, he was crazy. Yeah."}, {"t": 3575, "who": "Matt", "text": "Yeah."}, {"t": 3575, "who": "Mark", "text": "Yeah. Wang Yongqin. I— I can also type— type the name for you."}, {"t": 3579, "who": "Mark", "text": "He was crazy."}, {"t": 3582, "who": "Matt", "text": "Okay."}, {"t": 3585, "who": "Mark", "text": "Yeah. And he also studied so— started so many hospitals in Taiwan. He also studied, built the village for elderly people, and— but the market is still— still has so much room for you to explore."}, {"t": 3603, "who": "Mark", "text": "Yeah."}, {"t": 3611, "who": "Mark", "text": "Sorry. My— my brain just got— got a little bit of confusion."}, {"t": 3616, "who": "Matt", "text": "So the question is about escaping the machine. Are you allowed to escape the machine? Does it exist, or how does a machine change?"}, {"t": 3625, "who": "Mark", "text": "Okay. So am I allowed to escape the machine? I would say, legally, no."}, {"t": 3638, "who": "Mark", "text": "But if we are talking about in real life, yes, but I wouldn't do that. Yeah."}, {"t": 3649, "who": "Mark", "text": "And— but that doesn't mean I have to sacrifice my life for taking care of my mom, because— because— because it— it can also— it— yeah, a lot of people— I— I mean, 10 years ago, when I was in high school or college, we have been thinking about this a lot."}, {"t": 3673, "who": "Mark", "text": "And because it's like two generations fighting for resources, right? Time is also resource."}, {"t": 3682, "who": "Mark", "text": "Money is also resource. So it's like the— the older generation, they need someone to take care of them."}, {"t": 3689, "who": "Mark", "text": "Who is that someone? Younger generation have to take care of the older generation, or they are going to die uncareful, right?"}, {"t": 3699, "who": "Mark", "text": "And— but— but I— so— so let's say if the younger generation has to stay at home, to stay near to their parents, they lose the chance to— to actually develop their own life."}, {"t": 3720, "who": "Mark", "text": "So that is a death row. That— that don't go anywhere, right?"}, {"t": 3727, "who": "Mark", "text": "I would say I would probably tell, because— I mean, we are not rich, but my mom actually got some money from— from my grandma, right?"}, {"t": 3742, "who": "Matt", "text": "Mm-hmm."}, {"t": 3743, "who": "Mark", "text": "And— but she doesn't know how to— what to do with those money. And because you have property, you have money, you— you don't just use those properties to— to buy stuff. You actually try to use those properties to increase the value."}, {"t": 3765, "who": "Mark", "text": "And she do not have the knowledge, and she— she actually— she— she is actually kind of opposed to that. And I'm trying to talk her over this, try to actually tell her, \"I'm willing to take care of you, and I actually genuinely want to take care of yourself myself, but also have to— to— to— I have my own life to live, right?\""}, {"t": 3799, "who": "Mark", "text": "For example, I— I want to go to Germany, and I actually talked to her about this, and I— I said to her, \"Do you want to move to Germany one day?\" I also talked to her about it."}, {"t": 3811, "who": "Mark", "text": "Although it's still very far away, she said no, because Germany is not a place she is familiar with. She's old."}, {"t": 3818, "who": "Mark", "text": "She wants to stay in Taiwan. That's pretty reasonable, right?"}, {"t": 3822, "who": "Mark", "text": "And I say, \"Maybe when you are old— you are older, you may change your idea, because if you want someone to take care of you, if you want to see your son frankly, you will have to come with me. That makes sense."}, {"t": 3837, "who": "Mark", "text": "But we don't know how things will turn out then, because that's years later. But if you— you live long, I— I would actually love to see you have the resources and the property— the property to take care of yourself, because I'm not by your side."}, {"t": 3854, "who": "Mark", "text": "So you have to use those properties to protect yourself.\" So that's why I'm telling her to learn some knowledge about investment, to use those resources to— so the resources will never run out."}, {"t": 3869, "who": "Mark", "text": "Yeah."}, {"t": 3870, "who": "Matt", "text": "Yeah."}, {"t": 3871, "who": "Mark", "text": "Yeah. So the problem is, am I allowed to escape the machine legally? Yes, but my personal decision would be no, because I would actually try to teach her how to protect herself, how to keep the machine going."}, {"t": 3892, "who": "Mark", "text": "Yeah."}, {"t": 3892, "who": "Matt", "text": "So you would change the machine, because historically, the machine is your mom moves into your house, and you take care of her in your house."}, {"t": 3901, "who": "Mark", "text": "Yeah."}, {"t": 3901, "who": "Matt", "text": "And maybe you have, like, a helper or something."}, {"t": 3903, "who": "Mark", "text": "Yeah."}, {"t": 3904, "who": "Matt", "text": "But because you want to go to Germany, and you want to be there for a long amount of time, you want to change the machine, and you want to say, \"Okay, let me build a system so that you can still provide for yourself financially.\""}, {"t": 3916, "who": "Mark", "text": "Yeah."}, {"t": 3916, "who": "Matt", "text": "But then, you know, you use the income from the properties in order to hire the help that she does need that you wouldn't be able to do, because you're not there personally."}, {"t": 3927, "who": "Mark", "text": "Yeah."}, {"t": 3928, "who": "Matt", "text": "Yeah. I think, like, even in real machine systems, you have— you have hybrid systems, right? And this is, like, very much a hybrid."}, {"t": 3937, "who": "Matt", "text": "Some— some people completely fors— I don't want to say forsake or abandon their parents, but yeah, some people are extremely independent of their parents. And that would— you know, that would be the other— the other frequency."}, {"t": 3949, "who": "Matt", "text": "The bottom of the frequency. But you— you're like, \"Okay, let's— let's meet, like, a middle ground."}, {"t": 3953, "who": "Matt", "text": "I have to live my life, and it's— but I also have to take the responsibility for my mom.\""}, {"t": 3961, "who": "Mark", "text": "Yeah."}, {"t": 3961, "who": "Matt", "text": "Yeah. Okay. I think— I think it's very valid."}, {"t": 3964, "who": "Matt", "text": "Machines in real life are retrofitted all the time."}, {"t": 3969, "who": "Mark", "text": "We— we make the machine sustainable. Yeah."}, {"t": 3971, "who": "Matt", "text": "Yeah."}, {"t": 3972, "who": "Mark", "text": "So it can work on itself. Yeah."}, {"t": 3975, "who": "Matt", "text": "Yeah."}, {"t": 3978, "who": "Matt", "text": "Let's see."}, {"t": 3986, "who": "Matt", "text": "What else do you think that there is, like, a motif or something in the book that you, like, are very interested in talking about?"}, {"t": 3995, "who": "Mark", "text": "What's moti— oh, motif. Okay."}, {"t": 3999, "who": "Mark", "text": "I would say, actually, it's a— there is one motif or one— one angle I want to approach this story. Like I say, Dr."}, {"t": 4017, "who": "Mark", "text": "Harris performs a very high level of— of skills or of professionalism, right? But at the end of the day, I— I think you can quickly read the last few passages of— of the story."}, {"t": 4038, "who": "Mark", "text": "Can you do that? Because that's— that's very intriguing."}, {"t": 4042, "who": "Mark", "text": "Yeah."}, {"t": 4042, "who": "Matt", "text": "Wait. Just continue with your question first, and then I'll— and then I'll extract the information I need for that."}, {"t": 4048, "who": "Mark", "text": "Okay. So— so at the end of the day, he seems to also become a plant himself."}, {"t": 4061, "who": "Mark", "text": "Yeah. And seconds before, he is still doing everything he can."}, {"t": 4069, "who": "Mark", "text": "He— he is hurrying back to Wai 3 to— to finish the solution. But seconds later, everything changed."}, {"t": 4081, "who": "Matt", "text": "Okay. Do you see this as a— a problem? Is it— so, like, he— he also pivoted in his own life."}, {"t": 4093, "who": "Matt", "text": "Just as you're going from physics to doctor, he went from doctor to plant. And so is your question about why would somebody do that, or does somebody deserve to do that, or does that mean that his life as a doctor has less meaning, or—"}, {"t": 4112, "who": "Mark", "text": "No, no, no, no, no."}, {"t": 4113, "who": "Matt", "text": "Okay. So then what— what is your— what is your question about that scene?"}, {"t": 4118, "who": "Mark", "text": "No. Okay. I— I will answer that."}, {"t": 4121, "who": "Mark", "text": "I mean, throughout this whole story, I— I think that Harry is a man of— of resilience. So it actually surprised me that he become the plant at— at the end."}, {"t": 4138, "who": "Mark", "text": "In the end, right?"}, {"t": 4139, "who": "Matt", "text": "Yeah."}, {"t": 4140, "who": "Mark", "text": "So that— that was a quick change of the story."}, {"t": 4144, "who": "Matt", "text": "I think— because I haven't read the book myself, obviously— I think it is possible that a man, like, a family man, has so much responsibility. He is a tough man. He has to exist in a certain plane, right?"}, {"t": 4158, "who": "Matt", "text": "He—"}, {"t": 4159, "who": "Mark", "text": "Yeah."}, {"t": 4159, "who": "Matt", "text": "Has these expectations, and he does everything that he can. So as a doctor, you are professional. You do everything you can."}, {"t": 4166, "who": "Matt", "text": "But everyone not only has their own limits, but they also have their own realizations. It's not necessarily that he became contaminated with the virus, and so he was, like, succumbed to it, but it could be that he had the epiphany that, actually, we were all plants to begin with anyways."}, {"t": 4189, "who": "Matt", "text": "Why did we make ourselves— like, why did we give ourselves this burden of becoming a machine?"}, {"t": 4198, "who": "Mark", "text": "Yeah. But I understand. But as a real human being, right?"}, {"t": 4204, "who": "Mark", "text": "I am a human— real human being. I— I don't just reboot."}, {"t": 4207, "who": "Mark", "text": "I am not AI. And I— I don't know if AI have emotions, but I am sure they lack of real-life experience."}, {"t": 4214, "who": "Mark", "text": "I have 13 years of real-life experience. I know what it takes to become a professional."}, {"t": 4222, "who": "Mark", "text": "And it actually requires you be very resilient, and you have to suffer so much pain. So your character is hard to break, actually."}, {"t": 4237, "who": "Mark", "text": "Although you— you create midway."}, {"t": 4240, "who": "Matt", "text": "I'm going to— I understand what you're saying."}, {"t": 4245, "who": "Mark", "text": "Yeah."}, {"t": 4246, "who": "Matt", "text": "This is a question about purpose of life, okay?"}, {"t": 4249, "who": "Mark", "text": "Yeah."}, {"t": 4250, "who": "Matt", "text": "So most people are working to the end, like, to get to the— the means of the end."}, {"t": 4257, "who": "Matt", "text": "End of the means. Whatever."}, {"t": 4258, "who": "Matt", "text": "I forget. But basically, you have a purpose, and usually it is in order to buy enough properties to retire your mom, right?"}, {"t": 4265, "who": "Matt", "text": "Like, that's an example. Very few people—"}, {"t": 4268, "who": "Mark", "text": "Retire my mom sounds weird."}, {"t": 4271, "who": "Matt", "text": "Yeah. No, that's— that's actually how we say it in English. That's how we say it."}, {"t": 4275, "who": "Mark", "text": "Oh, okay."}, {"t": 4275, "who": "Matt", "text": "I want to— I want to retire my parents, for example."}, {"t": 4277, "who": "Mark", "text": "Okay, okay."}, {"t": 4279, "who": "Matt", "text": "Like, football stars, like Kobe Bryant, okay?"}, {"t": 4281, "who": "Mark", "text": "Okay."}, {"t": 4282, "who": "Matt", "text": "One of the first things they ask him is, like, \"Oh, what are you going to do with all this money?\" Like— like 99% of the time, they're going to say, \"I'm going to buy my mom a house and retire my mom.\""}, {"t": 4290, "who": "Mark", "text": "Okay."}, {"t": 4291, "who": "Matt", "text": "So this is a— this is a very normal phrasing. It— it sounds weird, yeah. But—"}, {"t": 4298, "who": "Mark", "text": "A Japanese word affects me, because in Japanese, sometimes retire means gone."}, {"t": 4305, "who": "Matt", "text": "Oh, sa."}, {"t": 4308, "who": "Mark", "text": "So you know why— why I react in that way? Because— yeah, you know why I react in that way. Yeah."}, {"t": 4315, "who": "Matt", "text": "I mean, they— they also use it that way, but, like, you know, that's only if you're in that lifestyle. But anyways, all right, the point I'm saying is—"}, {"t": 4323, "who": "Mark", "text": "Yeah."}, {"t": 4323, "who": "Matt", "text": "Okay. There's a really big joke in Silicon Valley, okay? So a lot of people— most people I know make more than $1 million a year."}, {"t": 4332, "who": "Matt", "text": "Some people make more than— I don't know them, but some people make more than $10 million a year, okay?"}, {"t": 4336, "who": "Mark", "text": "Yeah."}, {"t": 4337, "who": "Matt", "text": "And— and so why are they still working? They— they work— okay, let's say Nvidia employees, right? In— in America, most Nvidia employees make over $1 million a year."}, {"t": 4346, "who": "Mark", "text": "Mm."}, {"t": 4347, "who": "Matt", "text": "But they're still working."}, {"t": 4349, "who": "Mark", "text": "Yeah."}, {"t": 4349, "who": "Matt", "text": "They might be— they might be making $1 million a year for— for example, for 20 years. So they have $20 million saved, but they still work. And so you are the type of person that you say, \"I'm not working so I can make money so that I can tamping, basically, like, retire.\""}, {"t": 4366, "who": "Mark", "text": "No, no, no. I am not going to tamping. But I guess what you are trying to say, are they free?"}, {"t": 4370, "who": "Mark", "text": "Because they are still— they still have to work. Are they truly free?"}, {"t": 4375, "who": "Matt", "text": "That's a different question. That's a golden handcuff syndrome."}, {"t": 4378, "who": "Mark", "text": "No."}, {"t": 4378, "who": "Matt", "text": "Or just golden handcuffs in— in general. But what I'm saying is, some people are working because that is what they are going to do. Even if they didn't have employment there, they would find somewhere to work for free."}, {"t": 4392, "who": "Matt", "text": "Like, that's just in their nature."}, {"t": 4394, "who": "Mark", "text": "Yeah."}, {"t": 4395, "who": "Matt", "text": "And some other people are always trying to retire, always trying to become a plant, but you can't do that. So you have to work in order to, you know, put food in your stomach. And so the doctor, he might have realized, you know, like, \"Well, I've always wanted to retire gracefully,\" okay?"}, {"t": 4416, "who": "Matt", "text": "Like, you want to go on holiday, like, whatever it is. And like, \"Well, I could just do it now.\""}, {"t": 4423, "who": "Mark", "text": "Yeah."}, {"t": 4424, "who": "Matt", "text": "This is, like— this is one of my lives, okay? And so my— my goal was to retire when I was 35 years old. And so when I was 25, I had enough money."}, {"t": 4437, "who": "Matt", "text": "And so then I was like, \"Okay, let— let me just stop.\""}, {"t": 4442, "who": "Mark", "text": "Okay."}, {"t": 4443, "who": "Matt", "text": "Because, like, my purpose in joy was never in work itself."}, {"t": 4449, "who": "Mark", "text": "Okay."}, {"t": 4450, "who": "Matt", "text": "But that doesn't mean that I stop working. Because, like, you see, I— I'm doing English conversations right now."}, {"t": 4457, "who": "Mark", "text": "Yeah."}, {"t": 4457, "who": "Matt", "text": "I could just be scuba diving still."}, {"t": 4461, "who": "Mark", "text": "Yeah."}, {"t": 4461, "who": "Matt", "text": "Which is fine. But everyone else, you know, like, as a doctor, he could have just been like, \"Okay, everyone is really at peace. This is actually the end goal that I wanted anyways."}, {"t": 4471, "who": "Matt", "text": "Why do I have to wait until I am 70 years old to become a plant when I can just choose to become a plant now?\" Maybe he already fulfilled his mission, or maybe he hasn't."}, {"t": 4480, "who": "Matt", "text": "Either way. So you're seeing— you're seeing it from him, like, he hasn't fulfilled his mission yet."}, {"t": 4485, "who": "Matt", "text": "Why would he become a plant? And I'm seeing it from, he already fulfilled his mission."}, {"t": 4490, "who": "Matt", "text": "Why wait later to become a plant?"}, {"t": 4493, "who": "Mark", "text": "I see. But if you actually read the story, you can know seconds before he actually found a potential solution to all of that problem, and he was so eager to solve the problem."}, {"t": 4513, "who": "Matt", "text": "Okay."}, {"t": 4514, "who": "Mark", "text": "Yeah."}, {"t": 4514, "who": "Matt", "text": "I— I'll answer this in a different way, okay?"}, {"t": 4516, "who": "Mark", "text": "Yeah."}, {"t": 4517, "who": "Matt", "text": "Because what we're seeing right now is that becoming a plant is a problem."}, {"t": 4521, "who": "Mark", "text": "Yeah."}, {"t": 4521, "who": "Matt", "text": "But we have to— we have to view this from a different side. Is becoming a plant a problem? Okay."}, {"t": 4526, "who": "Matt", "text": "So if everybody around you is the same as you, then it becomes the standard. And so if you deviate from that, that's when you are strange, okay?"}, {"t": 4539, "who": "Matt", "text": "You are a nail that sticks out. Now, for example, in medicine, you know, most of the world, let's say today, is diabetic and/or has high blood pressure."}, {"t": 4551, "who": "Mark", "text": "Yeah, yeah."}, {"t": 4552, "who": "Matt", "text": "And so these people are the normal people."}, {"t": 4555, "who": "Mark", "text": "Yeah."}, {"t": 4556, "who": "Matt", "text": "Why would you choose not to have diabetes? Why would you choose not to have a heart attack? This is a theoretical question."}, {"t": 4562, "who": "Matt", "text": "I'm not asking you to answer it."}, {"t": 4563, "who": "Mark", "text": "Okay."}, {"t": 4563, "who": "Matt", "text": "And so the way I'm going to relate this is the normalization of unhappiness, okay? Most people in society are unhappy. At most, they are content."}, {"t": 4577, "who": "Matt", "text": "And so we— we view happiness, we view peace, we view doing nothing as a sickness."}, {"t": 4587, "who": "Mark", "text": "Yeah. I— I know. But also— I— I— I see your point."}, {"t": 4598, "who": "Mark", "text": "I— I mean, a society is like a system, yeah, because you— if you work, you get rewarded something. The society rewards you results of money, right?"}, {"t": 4610, "who": "Mark", "text": "So."}, {"t": 4611, "who": "Matt", "text": "Yeah."}, {"t": 4613, "who": "Mark", "text": "Okay. So let— let's phrase it another way. Do you think poverty is a sickness?"}, {"t": 4620, "who": "Mark", "text": "Do you think— think poverty is a disease?"}, {"t": 4625, "who": "Matt", "text": "Property?"}, {"t": 4626, "who": "Mark", "text": "Poverty."}, {"t": 4627, "who": "Matt", "text": "Poverty, poverty."}, {"t": 4629, "who": "Mark", "text": "Yeah. Because you say doing nothing is potentially not a disease. But do you think poverty is a disease?"}, {"t": 4640, "who": "Mark", "text": "It— it's like if you're taking too much sugar, you get diabetes, right? You get high pressure if you— you— you— you eat unhealthy."}, {"t": 4648, "who": "Mark", "text": "So— so— so I would say taking too much— taking too much sugar is not a disease, but it results in diabetes."}, {"t": 4660, "who": "Matt", "text": "Yeah."}, {"t": 4660, "who": "Mark", "text": "So it's— yeah."}, {"t": 4662, "who": "Matt", "text": "I would say."}, {"t": 4663, "who": "Mark", "text": "I— I— I think you see my point. Yeah."}, {"t": 4665, "who": "Matt", "text": "Yeah. Before I say if poverty is a disease or not, I would say that it is self-inflicted. Not by the individual, but by generations of culture."}, {"t": 4679, "who": "Mark", "text": "Yeah. Agree. Agree."}, {"t": 4680, "who": "Mark", "text": "Yeah."}, {"t": 4681, "who": "Matt", "text": "Yeah. So we know 500 years ago, our ancestors were, you know, looking for food, like, in the wilderness or whatever it was, right? Picking berries, hunting, or whatever."}, {"t": 4696, "who": "Matt", "text": "So the question is."}, {"t": 4696, "who": "Mark", "text": "We got huge achievements by picking up a berry."}, {"t": 4701, "who": "Matt", "text": "Yeah. Were they in poverty? If you look at all indigenous tribes, they just— they— they want to continue eating off the land."}, {"t": 4708, "who": "Mark", "text": "Yeah."}, {"t": 4708, "who": "Matt", "text": "And so are they in poverty? Okay. I will say that, like, through society, we have enslaved people, willingly or unwillingly."}, {"t": 4720, "who": "Matt", "text": "There are some people that are truly still slaves to this day. And then there are people that have more liberties, but they still feel like slaves, right?"}, {"t": 4728, "who": "Matt", "text": "And so."}, {"t": 4728, "who": "Mark", "text": "Agree. In Taiwan, it's more stabile."}, {"t": 4732, "who": "Matt", "text": "Yeah. Poverty. Where does it come from?"}, {"t": 4734, "who": "Matt", "text": "It is a problem, by and large, that we created for ourselves so that we can solve it. And we do this as humans a lot."}, {"t": 4741, "who": "Matt", "text": "We— we make our own problems so that we can solve it and— and sell the solution again, right?"}, {"t": 4746, "who": "Mark", "text": "Yeah."}, {"t": 4747, "who": "Matt", "text": "So yes, I think— I think poverty is a disease."}, {"t": 4752, "who": "Mark", "text": "Okay. You think poverty is a disease. Yeah."}, {"t": 4756, "who": "Mark", "text": "Okay."}, {"t": 4760, "who": "Mark", "text": "I— I think you bring it out a little— you brought it out a little bit about in modern society, we still enslave people, but in a different way, right?"}, {"t": 4770, "who": "Matt", "text": "Yeah."}, {"t": 4771, "who": "Mark", "text": "Okay. So I think it's— it was when— it was when I was 22 or 23, I thought about it because I— I think a lot of time, I still got a whole lot ahead of me, right? And— and I was— I wa— I was actually trying to frame my value of seeing things."}, {"t": 4796, "who": "Mark", "text": "And I was asking myself, \"Do I want to work for others, or how much— how much wealth do I want to collect before I retire myself,\" right?"}, {"t": 4808, "who": "Matt", "text": "Yeah."}, {"t": 4808, "who": "Mark", "text": "And— and if I actually have to sacrifice some of my freedom to achieve that goal, how much freedom do I want to sacrifice?"}, {"t": 4823, "who": "Mark", "text": "Yeah. And I come out with a— a standard or a way of doing it."}, {"t": 4836, "who": "Mark", "text": "I would say I would act— actually sacrifice 99% of my life. It's very dangerous."}, {"t": 4845, "who": "Mark", "text": "I— I admit it's very dangerous. But— but also, like you say, you have so— you have extreme tests on so many things."}, {"t": 4853, "who": "Mark", "text": "So I— I think— I hope you can understand this as well. I would actually willingly sacrifice 99% of my personal life, just be my own slave."}, {"t": 4867, "who": "Mark", "text": "I don't want to be other people's slave. I want to be my own slave, like I switched my career."}, {"t": 4874, "who": "Matt", "text": "This is not strange at all, because every single entrepreneur is their own slave."}, {"t": 4879, "who": "Mark", "text": "Yeah. True. So I— I believe you can understand this."}, {"t": 4884, "who": "Mark", "text": "I want to be my own slave, 99% of my own life. I would love to sacrifice."}, {"t": 4889, "who": "Mark", "text": "I would love to give up. And for that 1% of my life, it's for my love, for my family, for my mom, or for my friend."}, {"t": 4898, "who": "Mark", "text": "That's 1%. So— so I— I cannot, like, complain during the process for the pain, because that's what I choose."}, {"t": 4911, "who": "Mark", "text": "I enslave myself, actually."}, {"t": 4915, "who": "Matt", "text": "Yeah, yeah. So that's a very good example. Sorry."}, {"t": 4918, "who": "Matt", "text": "So everyone is in the machine, but some people want to be in the machine, and they see their part in the machine. They say, like, \"Within the machine, I am actually my individual, and I own my— my freedom, and I choose to be here.\""}, {"t": 4937, "who": "Matt", "text": "I think that's— I think that's very, very common. There's a lot of people that are in different types of work that we would say it's a tragedy that they have to do that type of work."}, {"t": 4950, "who": "Matt", "text": "But some people, like, genuinely, genuinely like that work. Like, what comes to mind is sex work, okay?"}, {"t": 4959, "who": "Matt", "text": "We think that the— especially the women who go into sex work, it's because they're very desperate. They're unable to do anything else."}, {"t": 4967, "who": "Matt", "text": "They have to provide for their family, stuff like that. But there are some women who, like, they feel very empowered."}, {"t": 4976, "who": "Matt", "text": "Like, if they had the option to do sex work or just, you know, get $1 million, they would still just choose the sex work. And so."}, {"t": 4984, "who": "Mark", "text": "I mean, if— if I were a porn girl, I would— I would do it too. Obviously. For sure."}, {"t": 4991, "who": "Matt", "text": "But I'm saying, like, if you have an alternative where."}, {"t": 4994, "who": "Mark", "text": "Yeah."}, {"t": 4994, "who": "Matt", "text": "Because— because the reason you're doing any sort of work at all is usually for money, right? But if you gave them the option of, \"You could just have the money without doing the work,\" just like the Nvidia— the Nvidia employee, they don't have to work. They can just let their stock sit there and."}, {"t": 5010, "who": "Mark", "text": "Yeah."}, {"t": 5010, "who": "Matt", "text": "No matter what, they make more in their stock appreciating than they'll ever make out of work. But they still choose to. They want to."}, {"t": 5019, "who": "Matt", "text": "So just like you, you want to be your own slave 99% of the time. The way that you phrase it, I don't agree with, but your message behind it, yeah, I think, as you said, like, as an entrepreneur myself, I not only identify with it, I only understand your perspective."}, {"t": 5042, "who": "Matt", "text": "I don't understand everyone who is not working for themselves."}, {"t": 5048, "who": "Mark", "text": "True. Well— if you work for yourself, every— everything worth it. Yeah."}, {"t": 5054, "who": "Matt", "text": "Yeah. But the— the volatility of working for yourself is unbearable. And that's why I think I've talked to you about this before."}, {"t": 5061, "who": "Matt", "text": "Like, the most important thing before you go through the rest of your life is you really have to identify, \"Who are you? What makes you you?"}, {"t": 5072, "who": "Matt", "text": "What are your foundational beliefs?\" And so one of them could be you have to understand if you are risk-prone or risk-adverse."}, {"t": 5083, "who": "Matt", "text": "If you're— if you welcome risk or if you shy away from risk."}, {"t": 5089, "who": "Mark", "text": "Okay."}, {"t": 5089, "who": "Matt", "text": "So risk-prone and risk-adverse. Because if you try to do something that does not fit your character, you're going to have a lot of internal turmoil. Everybody— I— there's a few people I talk to, they're like, \"Oh, just open up a bubble tea shop anywhere in Taiwan and you'll make money no matter what.\""}, {"t": 5105, "who": "Matt", "text": "But they— they believe that. They believe that."}, {"t": 5107, "who": "Matt", "text": "And then I'm like, \"Well, if you look at the statistics, like, what is the statistics of a first-year bubble tea restaurant being successful in Taiwan?\" Let's say less than 20%, unless you're franchising, maybe it's higher, okay?"}, {"t": 5123, "who": "Matt", "text": "But everybody wants to do that, okay? I'm like, \"Fine, you know, go ahead and do it.\""}, {"t": 5126, "who": "Matt", "text": "But the first thing is you have to know, does it fit your character? Are you the type of person that you're— there's a difference between doing the bubble tea restaurant or shop yourself versus hiring people."}, {"t": 5141, "who": "Matt", "text": "If you're hiring people, what goes into that decision-making? Do you understand that?"}, {"t": 5147, "who": "Matt", "text": "And then if you're doing it yourself, what goes into that decision? Do you understand that?"}, {"t": 5151, "who": "Matt", "text": "And so a lot of people, because they don't understand themselves, they're going to be lost in all their decisions."}, {"t": 5159, "who": "Mark", "text": "Yeah."}, {"t": 5160, "who": "Matt", "text": "Yeah. And I'm sure, like, when you were making your change from career to career, you had a reflected reflection period where you're like, \"Okay, this is who I am. This is what I value."}, {"t": 5171, "who": "Matt", "text": "This is what I want to pursue.\""}, {"t": 5174, "who": "Mark", "text": "Yeah. Agree. Also, because the— the cats in our apartment are badass, I actually got to know a neighbor."}, {"t": 5185, "who": "Mark", "text": "And I think I told you before, I— we don't originally live in the current apartment we live right now, right? We moved from 大友, another area in 桃园."}, {"t": 5199, "who": "Mark", "text": "And that neighbor I got to know actually was from that place. And he actually ran a con— it's not construction company, it's 材料."}, {"t": 5212, "who": "Mark", "text": "Do you know what 材料 is? Material shop."}, {"t": 5215, "who": "Matt", "text": "Yeah, yeah, yeah."}, {"t": 5216, "who": "Mark", "text": "He— he owned a material shop. And he— he was in his 40s, so he was not— he— he's not much older than I am. So we still can understand what each other is talking about."}, {"t": 5227, "who": "Mark", "text": "Yeah."}, {"t": 5227, "who": "Matt", "text": "He's 45% older than you. He's much older than me."}, {"t": 5231, "who": "Mark", "text": "True. True. But only 10 years apart, so that's not— that's not— that's not huge."}, {"t": 5237, "who": "Mark", "text": "That's not a huge difference about, right?"}, {"t": 5240, "who": "Matt", "text": "He's almost 100% older than you, because if you say that, if your life doesn't begin until you're around 20 years old, you know?"}, {"t": 5248, "who": "Mark", "text": "Yeah. I see. So it's 15% apart, right?"}, {"t": 5251, "who": "Matt", "text": "Yeah. No, it's 100%."}, {"t": 5252, "who": "Mark", "text": "Yeah. I see you're 100%."}, {"t": 5253, "who": "Matt", "text": "He's— he's lived 100% higher than you, because from."}, {"t": 5256, "who": "Mark", "text": "Yeah. He lived higher than me."}, {"t": 5257, "who": "Matt", "text": "20 to 30 versus 20 to 40."}, {"t": 5260, "who": "Mark", "text": "Yeah. I agree. I agree."}, {"t": 5261, "who": "Mark", "text": "I agree. But we still can talk."}, {"t": 5263, "who": "Mark", "text": "Yeah. We still can understand each other."}, {"t": 5265, "who": "Mark", "text": "We— okay. I think I talk too much to him, actually."}, {"t": 5269, "who": "Mark", "text": "Yeah. He also talked too much to me too."}, {"t": 5272, "who": "Matt", "text": "Yeah."}, {"t": 5272, "who": "Mark", "text": "Yeah. He— he— he already has a daughter. Yeah."}, {"t": 5275, "who": "Mark", "text": "He lives with his wife."}, {"t": 5281, "who": "Mark", "text": "Okay. What do I bring this up?"}, {"t": 5286, "who": "Mark", "text": "I— I forgot again."}, {"t": 5289, "who": "Matt", "text": "Let's see. Wait. Actually, I can read the notes."}, {"t": 5300, "who": "Matt", "text": "Something in your apartment. Cats in your apartment?"}, {"t": 5304, "who": "Mark", "text": "Yes. Cats."}, {"t": 5306, "who": "Matt", "text": "Spell that. Chaos."}, {"t": 5309, "who": "Mark", "text": "Yeah. Chaos. Yeah."}, {"t": 5310, "who": "Matt", "text": "Okay. The— the tool I'm using said cats. I'm like."}, {"t": 5315, "who": "Mark", "text": "Okay. Cats. Yeah."}, {"t": 5317, "who": "Mark", "text": "In our apartment, I got to know this guy. Yeah."}, {"t": 5321, "who": "Mark", "text": "And— but before that, what— what— what were we— what were— what were we talking about?"}, {"t": 5329, "who": "Matt", "text": "Let me ask AI."}, {"t": 5331, "who": "Mark", "text": "Yeah."}, {"t": 5338, "who": "Matt", "text": "Whoa."}, {"t": 5353, "who": "Matt", "text": "How is this changing? We were discussing knowing yourself and the values of making a career."}, {"t": 5362, "who": "Matt", "text": "Before that?"}, {"t": 5363, "who": "Mark", "text": "But that doesn't fit."}, {"t": 5372, "who": "Mark", "text": "Knowing what I am. Knowing who I am."}, {"t": 5375, "who": "Mark", "text": "And if he."}, {"t": 5379, "who": "Matt", "text": "Building trust with your neighbors?"}, {"t": 5382, "who": "Mark", "text": "Building trust with my neighbors?"}, {"t": 5387, "who": "Mark", "text": "Maybe. But I— I don't think we were talking about trust."}, {"t": 5398, "who": "Mark", "text": "It was— I— I— I actually forgot."}, {"t": 5418, "who": "Matt", "text": "Was it— it wasn't the being an entrepreneur thing, was it?"}, {"t": 5422, "who": "Mark", "text": "No. We already moved on from that."}, {"t": 5431, "who": "Matt", "text": "Pro-risk, pro— risk-prone or risk-adverse knowing yourself?"}, {"t": 5448, "who": "Matt", "text": "I mean, yeah, the— the last thing you said was like a reflection of, \"You  and more of a plant, in terms of the book."}, {"t": 5712, "who": "Mark", "text": "Is that a question?"}, {"t": 5715, "who": "Matt", "text": "It's a fact. But— but— but I guess— I guess let's make it a question. Do you see— or at what point do you see— okay, let's say that you are an accomplished doctor."}, {"t": 5726, "who": "Matt", "text": "What— when do you transition from the doctor to a plant? And I guess your answer could be never, but answering that first, and then going back to, can you imagine why the doctor in the book became a plant?"}, {"t": 5743, "who": "Mark", "text": "Okay."}, {"t": 5744, "who": "Matt", "text": "Was it— was it a disease or not, right? Is poverty a disease? Was becoming a plant a disease?"}, {"t": 5749, "who": "Matt", "text": "Or was being a machine the disease?"}, {"t": 5755, "who": "Mark", "text": "Okay. I— I— I'm trying to figure out why he become a plant at a critical point."}, {"t": 5768, "who": "Mark", "text": "Because he seems very logical and very at least trying to figure out, despite all the— all the danger, despite all the mysteries."}, {"t": 5787, "who": "Mark", "text": "Quest. Yeah."}, {"t": 5793, "who": "Mark", "text": "He feels sad."}, {"t": 5804, "who": "Mark", "text": "Okay. When I first read it, I was probably 21, so that was about 9 years ago."}, {"t": 5813, "who": "Mark", "text": "I remember when I first read it. I believe it's a mental problem."}, {"t": 5820, "who": "Mark", "text": "Yeah. I believe it's a mental problem."}, {"t": 5822, "who": "Mark", "text": "It's a mental issue. And also he is a doctor himself, so he actually confirmed that the symptom or the chaos happening among the garrison, affecting people, affecting the person, man, is because I'm not astronaut."}, {"t": 5846, "who": "Mark", "text": "The environment simply 催眠怎么讲，我忘记了。"}, {"t": 5851, "who": "Matt", "text": "I don't know."}, {"t": 5853, "who": "Mark", "text": "Hypnotize?"}, {"t": 5857, "who": "Matt", "text": "We'll look."}, {"t": 5857, "who":
